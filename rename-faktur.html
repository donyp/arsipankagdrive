<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rename Faktur Pajak | Pusat Arsip Anka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        document.documentElement.style.opacity = '0';
        document.documentElement.classList.add('auth-loading');
    </script>
</head>
<body class="bg-[#F0F2F5] min-h-screen text-gray-800 font-sans">
    <div class="flex">
        <div id="mobile-overlay" class="mobile-overlay" onclick="toggleSidebar()"></div>
        <aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 flex flex-col z-40"></aside>

        <main id="main-content" class="min-h-screen transition-all duration-300 flex-1 ml-64 lg:ml-64">
            <!-- Top Bar -->
            <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-gray-200 px-6 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg text-gray-400 hover:bg-gray-100">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                        </button>
                        <div>
                            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest">Rename Faktur Pajak</h2>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <div class="p-6 space-y-6">
                <!-- Upload Area -->
                <div class="bg-white rounded-2xl p-8 shadow-xl border border-gray-100">
                    <h3 class="text-lg font-bold text-gray-900 mb-6 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                        Upload Faktur Pajak
                    </h3>

                    <!-- Drag Drop Area -->
                    <div id="dropzone" class="border-2 border-dashed border-blue-300 rounded-2xl p-12 text-center cursor-pointer transition-all hover:border-blue-500 hover:bg-blue-50/30">
                        <div class="flex flex-col items-center gap-4">
                            <div class="w-16 h-16 rounded-2xl bg-blue-50 flex items-center justify-center">
                                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                                </svg>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-gray-900">Drag dan drop file PDF di sini</p>
                                <p class="text-xs text-gray-500">atau klik untuk memilih file</p>
                            </div>
                            <input type="file" id="fileInput" multiple accept=".pdf" class="hidden" onchange="handleFiles(this.files)">
                        </div>
                    </div>

                    <!-- File List -->
                    <div id="fileList" class="mt-6 space-y-2 hidden">
                        <h4 class="text-sm font-bold text-gray-700">File yang akan diproses:</h4>
                        <div id="filesContainer" class="space-y-2 max-h-64 overflow-y-auto"></div>
                    </div>

                    <!-- Process Button -->
                    <div id="processButtonContainer" class="mt-6 hidden">
                        <button onclick="processFiles()" class="w-full px-6 py-4 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                            Proses & Download
                        </button>
                    </div>
                </div>

                <!-- Results -->
                <div id="resultsSection" class="bg-white rounded-2xl p-8 shadow-xl border border-gray-100 hidden">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-lg font-bold text-gray-900">History Rename Faktur</h3>
                        <div class="flex gap-2">
                            <button onclick="exportHistory()" class="px-4 py-2 bg-blue-100 text-blue-600 rounded-lg text-xs font-bold hover:bg-blue-200 transition-all">
                                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                Export CSV
                            </button>
                            <button onclick="clearAllHistory()" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg text-xs font-bold hover:bg-red-200 transition-all">
                                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                                Hapus Semua
                            </button>
                        </div>
                    </div>
                    <div id="resultsList" class="space-y-3"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Modal -->
    <div id="loadingModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-8 shadow-2xl max-w-md w-full mx-4">
            <!-- Animated Spinner -->
            <div class="flex justify-center mb-6">
                <div class="relative w-20 h-20">
                    <!-- Outer rotating ring -->
                    <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-blue-600 border-r-blue-400 animate-spin" style="animation-duration: 1.5s;"></div>
                    <!-- Middle rotating ring (opposite) -->
                    <div class="absolute inset-2 rounded-full border-3 border-transparent border-b-blue-600 border-l-blue-400 animate-spin" style="animation-duration: 2.5s; animation-direction: reverse;"></div>
                    <!-- Center dot -->
                    <div class="absolute inset-6 rounded-full bg-gradient-to-br from-blue-600 to-blue-400 shadow-lg shadow-blue-300"></div>
                </div>
            </div>

            <!-- Status Text -->
            <h3 class="text-lg font-bold text-gray-900 text-center mb-2">Memproses Faktur</h3>
            <p class="text-sm text-gray-600 text-center mb-6" id="loadingStatus">Sedang mengscan dan mengekstrak data...</p>

            <!-- Progress Bar -->
            <div class="space-y-3">
                <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                    <div id="loadingProgressBar" class="bg-gradient-to-r from-blue-600 to-blue-400 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p class="text-xs text-gray-500 text-center">
                    <span id="loadingProgressText">0</span>/<span id="loadingTotalFiles">0</span> file selesai
                </p>
            </div>

            <!-- File Being Processed -->
            <div class="mt-6 p-3 bg-blue-50 rounded-lg border border-blue-200">
                <p class="text-xs text-gray-600 mb-1">File sedang diproses:</p>
                <p class="text-sm font-mono text-blue-700 truncate" id="loadingCurrentFile">-</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/sidebar.js?v=ULTRACLEAN_2026"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/rename-faktur.js"></script>
    <script>
        // Initialize page after auth
        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            document.documentElement.style.opacity = '1';
            document.documentElement.classList.remove('auth-loading');
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // Fallback Toast if utils.js doesn't load
        if (typeof Toast === 'undefined') {
            window.Toast = {
                error: (msg) => alert('Error: ' + msg),
                success: (msg) => alert('Success: ' + msg),
                warning: (msg) => alert('Warning: ' + msg),
                info: (msg) => alert(msg)
            };
        }
    </script>
</body>
</html>
