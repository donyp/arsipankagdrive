<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen User - Pusat Arsip Anka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            zoom: 0.8;
        }
    </style>
</head>
<body class="bg-gray-50">
    <style>
        body {
            zoom: 0.8;
            transform-origin: top left;
            overflow-x: hidden;
        }
        #app {
            width: 100%;
        }
    </style>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div style="margin-left: 16rem; width: calc(100% - 16rem); transition: all 300ms ease;">
            <!-- Header -->
            <div class="bg-white sticky top-0 z-30 shadow-sm border-b border-gray-100">
                <div class="px-6 py-4">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest">Manajemen User</h2>
                </div>
            </div>

            <!-- Main Content -->
            <div class="p-6">
                <div class="space-y-6">
                    <!-- Page Header -->
                    <div class="flex items-center justify-between">
                        <div>
                            <h1 class="text-3xl font-bold text-gray-900">Manajemen User</h1>
                            <p class="text-gray-500 font-medium mt-1">Kelola akses dan hak istimewa pengguna sistem</p>
                        </div>
                        <button onclick="openUserModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition flex items-center gap-2 shadow-lg">
                            <i class="fas fa-plus"></i>
                            Tambah User
                        </button>
                    </div>

                    <!-- Stats Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
                            <p class="text-gray-500 text-sm font-medium mb-2">Total User</p>
                            <p id="stat-total-users" class="text-3xl font-bold text-gray-900">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
                            <p class="text-gray-500 text-sm font-medium mb-2">Admin Aktif</p>
                            <p id="stat-admin-users" class="text-3xl font-bold text-blue-600">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
                            <p class="text-gray-500 text-sm font-medium mb-2">Moderator</p>
                            <p id="stat-mod-users" class="text-3xl font-bold text-green-600">0</p>
                        </div>
                    </div>

                    <!-- Users Table -->
                    <div class="bg-white rounded-lg shadow-md border border-gray-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th class="px-6 py-3 font-bold text-gray-700">User</th>
                                        <th class="px-6 py-3 font-bold text-gray-700">Email</th>
                                        <th class="px-6 py-3 font-bold text-gray-700">Role</th>
                                        <th class="px-6 py-3 font-bold text-gray-700">Status</th>
                                        <th class="px-6 py-3 text-right font-bold text-gray-700">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="users-body">
                                    <tr class="border-b border-gray-200 hover:bg-gray-50">
                                        <td colspan="5" class="px-6 py-8 text-center text-gray-500">Memuat data...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/global-announcement.js?t=1735865200"></script>
    <script src="js/sidebar.js"></script>
</body>
</html>
