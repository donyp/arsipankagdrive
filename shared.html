<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared File | Pusat Arsip Anka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .share-card {
            background: white;
            border-radius: 24px;
            padding: 48px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .file-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease;
        }
        
        .btn-download:hover {
            transform: translateY(-2px);
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .info-label {
            color: #6b7280;
            font-size: 14px;
            font-weight: 600;
        }
        
        .info-value {
            color: #1f2937;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="share-card">
        <!-- Loading State -->
        <div id="loading-state">
            <div class="text-center">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-purple-600 mb-4"></div>
                <p class="text-gray-600 font-semibold">Loading shared file...</p>
            </div>
        </div>

        <!-- File Info -->
        <div id="file-info" class="hidden">
            <div class="file-icon">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                </svg>
            </div>

            <h1 class="text-2xl font-800 text-gray-900 mb-2 text-center" id="file-name">File Name</h1>
            <p class="text-gray-600 text-center mb-8">Someone shared this file with you</p>

            <div class="mb-8">
                <div class="info-row">
                    <span class="info-label">📁 Kategori</span>
                    <span class="info-value" id="file-category">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📦 Ukuran File</span>
                    <span class="info-value" id="file-size">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📅 Tanggal Upload</span>
                    <span class="info-value" id="file-date">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">⏰ Link Kadaluarsa</span>
                    <span class="info-value text-red-600" id="expires-at">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">👁️ Telah Diakses</span>
                    <span class="info-value" id="access-count">-</span>
                </div>
            </div>

            <button onclick="downloadFile()" class="btn-download">
                ⬇️ Download File
            </button>

            <p class="text-xs text-gray-500 text-center mt-6">
                🔒 Link ini aman dan akan kadaluarsa sesuai waktu yang ditentukan
            </p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden text-center">
            <div class="text-6xl mb-4">❌</div>
            <h2 class="text-xl font-bold text-gray-900 mb-2" id="error-title">Link Not Found</h2>
            <p class="text-gray-600" id="error-message">The shared link is invalid or has expired.</p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        let shareToken = '';
        let fileData = null;

        async function init() {
            // Extract token from URL
            const pathParts = window.location.pathname.split('/');
            shareToken = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];

            if (!shareToken || shareToken === 'shared.html') {
                showError('Invalid Link', 'No share token provided in URL.');
                return;
            }

            await loadSharedFile();
        }

        async function loadSharedFile() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/share/${shareToken}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load shared file');
                }

                fileData = data;
                displayFileInfo(data);

            } catch (err) {
                console.error('Load error:', err);
                showError('Access Denied', err.message);
            }
        }

        function displayFileInfo(data) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('file-info').classList.remove('hidden');

            document.getElementById('file-name').textContent = data.file.nama_file;
            document.getElementById('file-category').textContent = data.file.kategori || '-';
            document.getElementById('file-size').textContent = formatFileSize(data.file.file_size);
            document.getElementById('file-date').textContent = formatDate(data.file.uploaded_at);
            document.getElementById('expires-at').textContent = formatDateTime(data.share.expires_at);
            
            const accessText = data.share.max_access_count 
                ? `${data.share.access_count} / ${data.share.max_access_count}`
                : `${data.share.access_count} (Unlimited)`;
            document.getElementById('access-count').textContent = accessText;
        }

        function showError(title, message) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
            document.getElementById('error-title').textContent = title;
            document.getElementById('error-message').textContent = message;
        }

        async function downloadFile() {
            try {
                // Create download link
                const downloadUrl = `${API_BASE_URL}/api/share/${shareToken}/download`;
                
                // Create temporary link and trigger download
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = fileData.file.nama_file;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                Swal.fire({
                    icon: 'success',
                    title: 'Download Started',
                    text: 'Your file download has started.',
                    timer: 2000
                });

            } catch (err) {
                console.error('Download error:', err);
                Swal.fire({
                    icon: 'error',
                    title: 'Download Failed',
                    text: 'Failed to download file. Please try again.'
                });
            }
        }

        function formatFileSize(bytes) {
            if (!bytes) return '-';
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            return new Date(dateString).toLocaleDateString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function formatDateTime(dateString) {
            if (!dateString) return '-';
            return new Date(dateString).toLocaleString('id-ID', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
