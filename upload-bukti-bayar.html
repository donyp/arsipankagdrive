<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Bukti Bayar - Pusat Arsip Anka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <style>
        body {
            zoom: 0.8;
            transform-origin: top left;
            overflow-x: hidden;
        }
        #app {
            width: 100%;
        }
    </style>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div style="margin-left: 16rem; width: calc(100% - 16rem); transition: all 300ms ease;">
            <!-- Header -->
            <div class="gradient-header text-white sticky top-0 z-30 shadow-lg">
                <div class="px-6 py-8">
                    <div class="flex items-center gap-3">
                        <div class="bg-white/20 p-3 rounded-lg">
                            <i class="fas fa-receipt text-2xl"></i>
                        </div>
                        <div>
                            <h1 class="text-3xl font-bold">Upload Bukti Bayar</h1>
                            <p class="text-green-100 text-sm mt-1">Upload dokumen bukti pembayaran invoice</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="p-6 max-w-4xl mx-auto">
                <!-- Info Box -->
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                    <p class="text-blue-800 text-sm">
                        <i class="fas fa-info-circle mr-2"></i>
                        <strong>Informasi:</strong> Upload file bukti pembayaran (PDF, JPG, PNG) untuk invoice
                    </p>
                </div>

                <!-- Upload Card -->
                <div class="bg-white rounded-lg shadow-md p-8 mb-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <i class="fas fa-cloud-upload-alt text-green-600"></i>
                        Drag & Drop Bukti Bayar
                    </h2>

                    <!-- Drop Zone -->
                    <div id="dropZone" style="border: 2px dashed #10b981; border-radius: 12px; padding: 60px 40px; text-align: center; cursor: pointer; transition: all 0.3s; background: #f0fdf4;">
                        <i class="fas fa-file-upload" style="font-size: 64px; color: #10b981; margin-bottom: 15px; display: block;"></i>
                        <p style="margin: 0 0 15px 0; color: #2c3e50; font-weight: 600; font-size: 18px;">Drag & drop file di sini</p>
                        <span style="font-size: 14px; color: #7f8c8d;">atau klik untuk memilih file (PDF, JPG, PNG)</span>
                    </div>

                    <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" multiple style="display: none;">

                    <!-- Stats -->
                    <div id="stats" style="display: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 30px 0;">
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 28px; font-weight: 700; color: #2c3e50;" id="totalFiles">0</div>
                            <div style="font-size: 12px; color: #7f8c8d; text-transform: uppercase; margin-top: 5px;">Total File</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 28px; font-weight: 700; color: #10b981;" id="validFiles">0</div>
                            <div style="font-size: 12px; color: #7f8c8d; text-transform: uppercase; margin-top: 5px;">Valid ✓</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 28px; font-weight: 700; color: #e74c3c;" id="invalidFiles">0</div>
                            <div style="font-size: 12px; color: #7f8c8d; text-transform: uppercase; margin-top: 5px;">Invalid ✗</div>
                        </div>
                    </div>

                    <!-- Files List -->
                    <div id="filesList" style="display: none; margin-top: 30px;">
                        <h4 style="color: #2c3e50; margin-bottom: 15px; font-size: 16px; font-weight: 600;">File Selection:</h4>
                        <div id="filesContainer"></div>
                    </div>

                    <!-- Buttons -->
                    <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 30px;">
                        <button class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded-lg transition" onclick="resetUpload()">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                        <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition" id="btnUpload" disabled>
                            <i class="fas fa-upload"></i> Upload Bukti Bayar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
</body>
</html>
