<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | Pusat Arsip Anka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body {
            touch-action: pan-y;
            -ms-touch-action: pan-y;
        }
        
        #sidebar {
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
        }
        
        #sidebar::-webkit-scrollbar {
            width: 6px;
        }
        
        #sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        
        #sidebar::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 3px;
        }
        
        #sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.5);
        }
    </style>
    <script>
        document.documentElement.style.opacity = '0';
        document.documentElement.classList.add('auth-loading');
    </script>
</head>

<body class="bg-[#F8FAFC] min-h-screen text-gray-800">

    <!-- Mobile Overlay -->
    <div id="mobile-overlay" class="mobile-overlay" onclick="toggleSidebar()"></div>

    <aside id="sidebar"
        class="sidebar fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-100 flex flex-col z-40 hidden">
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="min-h-screen transition-all duration-300">
        <!-- Top Bar -->
        <header class="sticky top-0 z-[45] bg-white/80 backdrop-blur-md border-b border-gray-100 px-6 py-2.5">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()"
                        class="lg:hidden p-2 rounded-lg text-gray-400 hover:bg-gray-100 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>

                <div class="flex items-center gap-3">
                    <!-- User Profile -->
                    <div id="user-profile-dropdown-container" class="relative">
                        <button onclick="toggleUserMenu()"
                            class="flex items-center gap-2 p-1 pr-2 rounded-full hover:bg-gray-50 transition-all border border-transparent hover:border-gray-100">
                            <div
                                class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-[9px] font-black text-white uppercase shadow-lg shadow-blue-200">
                                <span data-user-name-initials>ADMIN</span>
                            </div>
                            <div class="text-left hidden lg:block">
                                <p class="text-[10px] font-black text-gray-900 leading-none" data-user-name>User</p>
                            </div>
                            <svg class="w-2.5 h-2.5 text-gray-400" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>

                        <!-- Profile Dropdown Menu -->
                        <div id="user-menu"
                            class="absolute right-0 mt-3 w-52 bg-white border border-gray-100 rounded-2xl shadow-2xl transition-all opacity-0 invisible translate-y-2 py-2 z-50">
                            <button onclick="openProfileDetail()"
                                class="flex items-center gap-3 w-full px-4 py-3 text-xs font-bold text-gray-600 hover:text-blue-600 hover:bg-blue-50/50 transition-all text-left">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                                Profil Detail
                            </button>
                            <div class="h-px bg-gray-50 my-1 mx-2"></div>
                            <button onclick="logout()"
                                class="flex items-center gap-3 w-full px-4 py-3 text-xs font-bold text-red-500 hover:bg-red-50/50 transition-all text-left">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                </svg>
                                Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="p-6 max-w-7xl mx-auto">
            <div class="w-full space-y-8">

                <!-- Welcome Card -->
                <div class="bg-white rounded-3xl p-8 border border-gray-100 shadow-sm">
                    <h1 class="text-2xl md:text-3xl font-black text-gray-900 mb-4">
                        Selamat <span id="time-greeting">Datang</span>, <span data-user-name>User</span>!
                    </h1>
                    <p class="text-sm text-gray-600 mb-6">
                        Gunakan menu di sidebar untuk mengakses semua fitur sistem.
                    </p>
                    <div class="flex items-center gap-6 text-sm text-gray-600">
                        <div class="flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <span id="banner-date">...</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <span data-user-zona>Semua Zona</span>
                        </div>
                    </div>
                </div>

                <!-- Invoice List Container -->
                <div id="invoice-content-container">
                    <!-- Invoice list will be loaded here -->
                    <div id="invoice-embed" class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6">
                        <div class="text-center py-12">
                            <div class="inline-block w-12 h-12 border-4 border-blue-50 border-t-blue-600 rounded-full animate-spin"></div>
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mt-4 animate-pulse">Memuat Daftar Invoice...</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/invoice-list.js"></script>
    
    <script>
        // Load invoice list content into dashboard
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Wait for auth
                const user = await initAuth();
                if (!user) return;

                // Load invoice list HTML content
                const response = await fetch('invoice-list.html');
                const html = await response.text();
                
                // Extract main content from invoice-list.html
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Get the invoice content (tables, stats, etc)
                const invoiceContent = doc.querySelector('.invoice-container');
                if (invoiceContent) {
                    const container = document.getElementById('invoice-content-container');
                    container.innerHTML = invoiceContent.innerHTML;
                    
                    // Reinit invoice list functions
                    if (typeof init === 'function') {
                        init();
                    }
                }
            } catch (error) {
                console.error('Error loading invoice content:', error);
            }
        });
    </script>
</body>

</html>
