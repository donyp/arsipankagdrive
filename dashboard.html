<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | Pusat Arsip Anka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            zoom: 0.75;
        }
        
        /* File list - use Poppins font */
        .invoice-table {
            font-family: 'Poppins', sans-serif;
        }
        .invoice-container {
            padding: 10px;
            width: 100%;
            margin: 0;
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .invoice-header h1 {
            font-size: 28px;
            color: #2c3e50;
            font-weight: 900;
            text-align: left;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-refresh {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-refresh:hover {
            background: #2980b9;
        }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid #f0f0f0;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 13px;
            color: #7f8c8d;
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
        }

        .stat-card.total .stat-value { color: #3498db; }
        .stat-card.uploaded .stat-value { color: #27ae60; }
        .stat-card.pending .stat-value { color: #f39c12; }
        .stat-card.missing .stat-value { color: #e74c3c; }

        /* Filters */
        .filters-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 1px solid #f0f0f0;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 6px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: left;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px;
            border: 2px solid #ecf0f1;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            background: white;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .btn-filter {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .btn-filter:hover {
            background: #2980b9;
        }

        .btn-reset {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-reset:hover {
            background: #7f8c8d;
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #f0f0f0;
        }

        .invoice-table {
            width: 100%;
            border-collapse: collapse;
        }

        .invoice-table thead {
            background: #34495e;
            color: white;
        }

        .invoice-table th {
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .invoice-table tbody tr {
            transition: background 0.2s;
        }

        .invoice-table tbody tr:hover {
            background: #f8f9fa;
        }

        .invoice-table td {
            padding: 12px;
            font-size: 13px;
            color: #2c3e50;
            border-right: 1px solid #ecf0f1;
            font-weight: 700;
        }
        
        .invoice-table td:last-child {
            border-right: none;
        }

        /* Status Badge */
        .status-badge {
            display: inline;
            font-size: 15px !important;
            font-weight: 900 !important;
            padding: 0;
            margin: 0;
        }

        .status-badge::before {
            content: "●";
            margin-right: 4px;
        }

        .status-badge.uploaded {
            background: transparent;
            color: #27ae60;
        }

        .status-badge.pending {
            background: transparent;
            color: #f39c12;
        }

        .status-badge.missing {
            background: transparent;
            color: #e74c3c;
        }

        /* Buttons in Row */
        .btn-upload-pdf {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-upload-pdf:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .btn-upload-pdf:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-view-file {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-view-file:hover {
            background: #2980b9;
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #ecf0f1;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pagination-info {
            color: #7f8c8d;
            font-size: 13px;
        }

        .pagination-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-page {
            background: white;
            border: 2px solid #3498db;
            color: #3498db;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-page:hover {
            background: #3498db;
            color: white;
        }

        .btn-page:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.visible {
            display: flex;
        }

        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .loading-spinner i {
            font-size: 48px;
            color: #3498db;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            color: #bdc3c7;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        /* Currency Format */
        .currency {
            font-weight: 600;
            color: #27ae60;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .invoice-container {
                padding: 20px 0;
            }

            .filters-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }

            .invoice-table {
                font-size: 12px;
            }

            .invoice-table th,
            .invoice-table td {
                padding: 10px 8px;
            }

            .stats-container {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 12px;
                margin-bottom: 20px;
            }
        }

        @media (max-width: 768px) {
            .invoice-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
            }

            .header-actions button {
                width: 100%;
                justify-content: center;
            }

            .filters-grid {
                grid-template-columns: 1fr;
            }

            .invoice-table {
                font-size: 11px;
            }

            .pagination-container {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
    <style>
        html, body {
            touch-action: pan-y;
            -ms-touch-action: pan-y;
        }
        
        #sidebar {
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
        }
        
        #sidebar::-webkit-scrollbar {
            width: 6px;
        }
        
        #sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        
        #sidebar::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 3px;
        }
        
        #sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.5);
        }
    </style>
    <script>
        document.documentElement.style.opacity = '0';
        document.documentElement.classList.add('auth-loading');
    </script>
</head>

        <!-- Main Content -->

    <!-- Scripts -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/dashboard.js?v=999"></script>
    
    <script>
        // Load invoice list content into dashboard (including header with buttons)
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Wait for auth
                const user = await initAuth();
                if (!user) return;

                // Set current date/time greeting
                setCurrentDate();

                // Load invoice list HTML content
                const response = await fetch('invoice-list.html');
                const html = await response.text();
                
                // Extract main content from invoice-list.html
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Get the invoice container with header and all content
                const invoiceContent = doc.querySelector('.invoice-container');
                if (invoiceContent) {
                    const container = document.getElementById('invoice-content-container');
                    
                    // Load entire invoice container content (including header with buttons)
                    container.innerHTML = invoiceContent.innerHTML;
                    
                    // Extract and apply styles from invoice-list.html
                    const styleElements = doc.querySelectorAll('style');
                    styleElements.forEach(style => {
                        if (style.textContent.includes('.invoice-container') || 
                            style.textContent.includes('.stat-card') ||
                            style.textContent.includes('.filters-container')) {
                            const newStyle = document.createElement('style');
                            newStyle.textContent = style.textContent;
                            document.head.appendChild(newStyle);
                        }
                    });
                    
                    // Extract and inject the upload modal
                    const uploadModal = doc.getElementById('uploadExcelModal');
                    if (uploadModal) {
                        const modalClone = uploadModal.cloneNode(true);
                        document.body.appendChild(modalClone);
                        console.log('[Dashboard] ✅ Upload modal injected');
                    } else {
                        console.warn('[Dashboard] ⚠️ Upload modal not found in invoice-list.html');
                    }
                    
                    // Reinit invoice list functions
                    if (typeof init === 'function') {
                        init();
                    }
                    
                    // Setup modal after a small delay
                    setTimeout(() => {
                        if (typeof setupExcelUploadModal === 'function') {
                            setupExcelUploadModal();
                        }
                    }, 100);
                }
            } catch (error) {
                console.error('Error loading invoice content:', error);
            }
        });
    </script>
</body>
