<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Activity Log | Pusat Arsip Anka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Fix: Prevent zoom on navigation */
        html, body {
            touch-action: pan-y;
            -ms-touch-action: pan-y;
        }
        
        /* Fix: Sidebar scroll - prevent scroll propagation to main content */
        #sidebar {
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
        }
        
        #sidebar::-webkit-scrollbar {
            width: 6px;
        }
        
        #sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        
        #sidebar::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 3px;
        }
        
        #sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.5);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }
        
        .timeline-line {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            top: 0;
            bottom: 0;
            background: linear-gradient(to bottom, #e5e7eb, #d1d5db, #e5e7eb);
        }
        
        .log-card {
            position: relative;
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #e5e7eb;
            transition: all 0.2s ease;
        }
        
        .log-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        
        .action-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .action-create { background: #dcfce7; color: #166534; }
        .action-update { background: #fef3c7; color: #92400e; }
        .action-delete { background: #fee2e2; color: #991b1b; }
        .action-download { background: #dbeafe; color: #1e40af; }
        .action-login { background: #e0e7ff; color: #4338ca; }
        .action-default { background: #f3f4f6; color: #4b5563; }
        
        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            border: 1.5px solid #e5e7eb;
            color: #6b7280;
        }
        
        .filter-chip:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        .filter-chip.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        
        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e5e7eb;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
    <script>
        document.documentElement.style.opacity = '0';
        document.documentElement.classList.add('auth-loading');
    </script>
</head>
<body>
    <aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 flex flex-col z-40" style="display: none;"></aside>

    <main id="main-content" class="p-8" style="margin-left: 0;">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h1 class="text-3xl font-800 text-gray-900 mb-2">📋 Activity Log</h1>
                        <p class="text-gray-600">Monitor all system activities and user actions</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="exportLogs()" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-all">
                            📊 Export CSV
                        </button>
                        <button onclick="refreshLogs()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition-all">
                            🔄 Refresh
                        </button>
                    </div>
                </div>
                
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div class="stat-card">
                        <p class="text-xs font-bold text-gray-500 uppercase mb-1">Total Activities</p>
                        <p class="stat-number" id="stat-total">0</p>
                    </div>
                    <div class="stat-card">
                        <p class="text-xs font-bold text-gray-500 uppercase mb-1">Today</p>
                        <p class="stat-number text-green-600" id="stat-today">0</p>
                    </div>
                    <div class="stat-card">
                        <p class="text-xs font-bold text-gray-500 uppercase mb-1">Active Users</p>
                        <p class="stat-number text-blue-600" id="stat-users">0</p>
                    </div>
                    <div class="stat-card">
                        <p class="text-xs font-bold text-gray-500 uppercase mb-1">Last Hour</p>
                        <p class="stat-number text-purple-600" id="stat-hour">0</p>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="bg-white rounded-2xl p-6 mb-6 border border-gray-200">
                <div class="flex flex-wrap gap-3 items-center mb-4">
                    <span class="text-xs font-bold text-gray-500 uppercase">⚡ Quick Filters:</span>
                    <div class="filter-chip active" data-action="all" onclick="filterByAction('all')">
                        <span>All Actions</span>
                    </div>
                    <div class="filter-chip" data-action="CREATE" onclick="filterByAction('CREATE')">
                        <span>🟢 Create</span>
                    </div>
                    <div class="filter-chip" data-action="UPDATE" onclick="filterByAction('UPDATE')">
                        <span>🟡 Update</span>
                    </div>
                    <div class="filter-chip" data-action="DELETE" onclick="filterByAction('DELETE')">
                        <span>🔴 Delete</span>
                    </div>
                    <div class="filter-chip" data-action="DOWNLOAD" onclick="filterByAction('DOWNLOAD')">
                        <span>🔵 Download</span>
                    </div>
                    <div class="filter-chip" data-action="LOGIN" onclick="filterByAction('LOGIN')">
                        <span>🟣 Login</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="text" id="search-user" placeholder="🔍 Search by username..." class="px-4 py-2 border border-gray-300 rounded-lg text-sm" onkeyup="applyFilters()">
                    <input type="date" id="filter-date-start" class="px-4 py-2 border border-gray-300 rounded-lg text-sm" onchange="applyFilters()">
                    <input type="date" id="filter-date-end" class="px-4 py-2 border border-gray-300 rounded-lg text-sm" onchange="applyFilters()">
                    <button onclick="resetFilters()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-200 transition-all">
                        Reset Filters
                    </button>
                </div>
            </div>

            <!-- Activity Feed -->
            <div id="activity-feed" class="space-y-4">
                <!-- Logs will be rendered here by JavaScript -->
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-16">
                <div class="text-6xl mb-4">📭</div>
                <p class="text-xl font-semibold text-gray-600 mb-2">No activities found</p>
                <p class="text-gray-500">Try adjusting your filters or check back later</p>
            </div>
            
            <!-- Loading State -->
            <div id="loading-state" class="text-center py-16">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-blue-600 mb-4"></div>
                <p class="text-gray-600 font-semibold">Loading activity logs...</p>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js?v=20260829"></script>
    <script src="js/utils.js?v=20260829"></script>
    <script src="js/sidebar.js?v=20260829"></script>

    <script>
        let allLogs = [];
        let filteredLogs = [];
        let currentActionFilter = 'all';
        
        async function init() {
            const user = await initAuth();
            if (!user) return;
            
            // Show sidebar for non-admin_zona
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            
            if (user.role === 'admin_zona') {
                sidebar.style.display = 'none';
                mainContent.style.marginLeft = '0';
            } else {
                sidebar.style.display = 'flex';
                mainContent.style.marginLeft = '16rem';
            }
            
            try {
                await loadLogs();
                
                // Auto-refresh every 30 seconds
                setInterval(refreshLogs, 30000);
            } catch (err) {
                console.error('Init error:', err);
                // Show error and redirect for non-admin users
                await Swal.fire({
                    icon: 'info',
                    title: 'Akses Terbatas',
                    text: 'Halaman Activity Log hanya dapat diakses oleh Super Admin dan Moderator. Fitur ini digunakan untuk monitoring aktivitas sistem.',
                    confirmButtonText: 'Kembali ke Dashboard'
                });
                window.location.href = 'dashboard.html';
            }
        }
        
        async function loadLogs() {
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            
            try {
                const { logs } = await API.get('/api/audit-logs');
                allLogs = logs || [];
                applyFilters();
                updateStats();
            } catch (err) {
                console.error('Failed to load logs:', err);
                document.getElementById('loading-state').classList.add('hidden');
                throw err; // Re-throw to be caught by init
            } finally {
                document.getElementById('loading-state').classList.add('hidden');
            }
        }
        
        function applyFilters() {
            const searchTerm = document.getElementById('search-user').value.toLowerCase();
            const startDate = document.getElementById('filter-date-start').value;
            const endDate = document.getElementById('filter-date-end').value;
            
            filteredLogs = allLogs.filter(log => {
                // Action filter
                if (currentActionFilter !== 'all' && log.action !== currentActionFilter) {
                    return false;
                }
                
                // Search filter
                if (searchTerm && !log.users?.name?.toLowerCase().includes(searchTerm)) {
                    return false;
                }
                
                // Date range filter
                if (startDate) {
                    const logDate = new Date(log.created_at).toISOString().split('T')[0];
                    if (logDate < startDate) return false;
                }
                if (endDate) {
                    const logDate = new Date(log.created_at).toISOString().split('T')[0];
                    if (logDate > endDate) return false;
                }
                
                return true;
            });
            
            renderLogs();
        }
        
        function filterByAction(action) {
            currentActionFilter = action;
            
            // Update UI
            document.querySelectorAll('.filter-chip').forEach(chip => {
                if (chip.dataset.action === action) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });
            
            applyFilters();
        }
        
        function renderLogs() {
            const feed = document.getElementById('activity-feed');
            const emptyState = document.getElementById('empty-state');
            
            if (filteredLogs.length === 0) {
                feed.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            feed.innerHTML = filteredLogs.map(log => {
                const actionClass = getActionClass(log.action);
                const icon = getActionIcon(log.action);
                const timeAgo = getTimeAgo(log.created_at);
                
                return `
                    <div class="log-card">
                        <div class="flex items-start gap-4">
                            <div class="flex-shrink-0">
                                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(log.users?.name || 'System')}&background=667eea&color=fff&bold=true" 
                                     class="w-12 h-12 rounded-full border-2 border-white shadow-md">
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="font-bold text-gray-900">${log.users?.name || 'System'}</span>
                                    <span class="action-badge ${actionClass}">
                                        ${icon} ${log.action}
                                    </span>
                                    <span class="text-xs text-gray-500 ml-auto">${timeAgo}</span>
                                </div>
                                <p class="text-sm text-gray-700 mb-1">${log.context}</p>
                                <div class="flex items-center gap-4 text-xs text-gray-500">
                                    <span>📅 ${formatDateTime(log.created_at)}</span>
                                    <span>👤 ${getRoleBadge(log.users?.role)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function getActionClass(action) {
            const map = {
                'CREATE': 'action-create',
                'UPDATE': 'action-update',
                'DELETE': 'action-delete',
                'DOWNLOAD': 'action-download',
                'LOGIN': 'action-login'
            };
            return map[action] || 'action-default';
        }
        
        function getActionIcon(action) {
            const map = {
                'CREATE': '✨',
                'UPDATE': '📝',
                'DELETE': '🗑️',
                'DOWNLOAD': '⬇️',
                'LOGIN': '🔐'
            };
            return map[action] || '📌';
        }
        
        function getRoleBadge(role) {
            if (role === 'super_admin') return 'Super Admin';
            if (role === 'moderator') return 'Moderator';
            if (role === 'admin_zona') return 'Admin Zona';
            return role || '-';
        }
        
        function updateStats() {
            // Total
            document.getElementById('stat-total').textContent = allLogs.length;
            
            // Today
            const today = new Date().toISOString().split('T')[0];
            const todayCount = allLogs.filter(log => log.created_at.startsWith(today)).length;
            document.getElementById('stat-today').textContent = todayCount;
            
            // Active users (unique users in last 24h)
            const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
            const recentUsers = new Set(
                allLogs
                    .filter(log => new Date(log.created_at) > oneDayAgo)
                    .map(log => log.user_id)
            );
            document.getElementById('stat-users').textContent = recentUsers.size;
            
            // Last hour
            const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000);
            const hourCount = allLogs.filter(log => new Date(log.created_at) > oneHourAgo).length;
            document.getElementById('stat-hour').textContent = hourCount;
        }
        
        function getTimeAgo(timestamp) {
            const seconds = Math.floor((new Date() - new Date(timestamp)) / 1000);
            
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' minutes ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
            return Math.floor(seconds / 86400) + ' days ago';
        }
        
        function formatDateTime(timestamp) {
            return new Date(timestamp).toLocaleString('id-ID', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        function resetFilters() {
            document.getElementById('search-user').value = '';
            document.getElementById('filter-date-start').value = '';
            document.getElementById('filter-date-end').value = '';
            filterByAction('all');
        }
        
        async function refreshLogs() {
            await loadLogs();
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: 'Activity logs refreshed',
                showConfirmButton: false,
                timer: 2000
            });
        }
        
        function exportLogs() {
            const csv = convertToCSV(filteredLogs);
            downloadCSV(csv, `activity-log-${new Date().toISOString().split('T')[0]}.csv`);
        }
        
        function convertToCSV(data) {
            const headers = ['Timestamp', 'User', 'Role', 'Action', 'Context'];
            const rows = data.map(log => [
                formatDateTime(log.created_at),
                log.users?.name || 'System',
                getRoleBadge(log.users?.role),
                log.action,
                log.context.replace(/"/g, '""') // Escape quotes
            ]);
            
            return [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');
        }
        
        function downloadCSV(csv, filename) {
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
