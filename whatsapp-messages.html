<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi Zona - Pusat Arsip Anka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>html, body { zoom: 0.8; }</style>
</head>
<body class="bg-gray-50">
    <div id="app">
        <div id="sidebar"></div>
        <div style="margin-left: 16rem; width: calc(100% - 16rem); transition: all 300ms ease;">
            <div class="bg-white sticky top-0 z-30 shadow-sm border-b border-gray-100">
                <div class="px-6 py-4"><h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest">Notifikasi WhatsApp</h2></div>
            </div>
            <div class="p-6">
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h1 class="text-3xl font-bold text-gray-900">Pesan WhatsApp</h1>
                            <p class="text-gray-500 font-medium mt-1">Kelola dan pantau pesan WhatsApp ke zona</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
                            <p class="text-gray-500 text-sm font-medium mb-2">Total Pesan</p>
                            <p id="stat-total-messages" class="text-3xl font-bold text-gray-900">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
                            <p class="text-gray-500 text-sm font-medium mb-2">Sudah Dikirim</p>
                            <p id="stat-sent-messages" class="text-3xl font-bold text-green-600">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
                            <p class="text-gray-500 text-sm font-medium mb-2">Pending</p>
                            <p id="stat-pending-messages" class="text-3xl font-bold text-yellow-600">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
                            <p class="text-gray-500 text-sm font-medium mb-2">Invoice Messages</p>
                            <p id="stat-invoice-messages" class="text-3xl font-bold text-blue-600">0</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Regular Messages -->
                        <div class="bg-white rounded-lg shadow-md border border-gray-100 overflow-hidden">
                            <div class="px-6 py-4 border-b border-gray-200">
                                <h2 class="text-lg font-bold text-gray-900"><i class="fas fa-comments mr-2 text-blue-600"></i>Notifikasi Upload</h2>
                            </div>
                            <div class="overflow-y-auto" style="max-height: 500px;">
                                <div id="messages-body" class="divide-y divide-gray-200">
                                    <div class="px-6 py-4 text-center text-gray-500"><i class="fas fa-spinner fa-spin"></i> Memuat pesan...</div>
                                </div>
                            </div>
                        </div>

                        <!-- Invoice Messages -->
                        <div class="bg-white rounded-lg shadow-md border border-gray-100 overflow-hidden">
                            <div class="px-6 py-4 border-b border-gray-200">
                                <h2 class="text-lg font-bold text-gray-900"><i class="fas fa-file-invoice-dollar mr-2 text-green-600"></i>Notifikasi Invoice</h2>
                            </div>
                            <div class="overflow-y-auto" style="max-height: 500px;">
                                <div id="invoice-messages-body" class="divide-y divide-gray-200">
                                    <div class="px-6 py-4 text-center text-gray-500"><i class="fas fa-spinner fa-spin"></i> Memuat pesan...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        let currentMessages = [], currentInvoiceMessages = [];
        
        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth(); await loadSidebar('whatsapp-messages.html'); await loadMessages();
        });

        async function loadMessages() {
            try {
                const [msgs, invoiceMsgs] = await Promise.all([
                    API.get('/api/whatsapp/pending-messages'),
                    API.get('/api/whatsapp/pending-invoice-messages')
                ]);
                
                currentMessages = msgs.notifications || [];
                currentInvoiceMessages = invoiceMsgs.notifications || [];
                
                // Update stats
                const totalSent = currentMessages.filter(m => m.sent_at).length;
                const totalPending = currentMessages.filter(m => !m.sent_at).length;
                
                document.getElementById('stat-total-messages').textContent = currentMessages.length;
                document.getElementById('stat-sent-messages').textContent = totalSent;
                document.getElementById('stat-pending-messages').textContent = totalPending;
                document.getElementById('stat-invoice-messages').textContent = currentInvoiceMessages.length;
                
                renderMessages();
            } catch (err) {
                console.error('Error loading messages:', err);
                alert('Error: ' + err.message);
            }
        }

        function renderMessages() {
            // Regular messages
            const msgBody = document.getElementById('messages-body');
            if (currentMessages.length === 0) {
                msgBody.innerHTML = '<div class="px-6 py-8 text-center text-gray-500">Tidak ada pesan</div>';
            } else {
                msgBody.innerHTML = currentMessages.map(msg => `
                    <div class="px-6 py-4 hover:bg-gray-50 transition">
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <p class="font-medium text-gray-900">${msg.zona_id || 'Unknown'}</p>
                                <p class="text-xs text-gray-500">${new Date(msg.created_at).toLocaleString('id-ID')}</p>
                            </div>
                            <span class="inline-block px-2 py-1 rounded-full text-xs font-medium ${msg.sent_at ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                ${msg.sent_at ? 'Terkirim' : 'Pending'}
                            </span>
                        </div>
                        <div class="text-sm text-gray-600 mb-3 bg-gray-50 p-3 rounded whitespace-pre-wrap">${msg.message || 'N/A'}</div>
                        <div class="flex gap-2">
                            ${!msg.sent_at ? `<button onclick="markMessageSent('${msg.id}')" class="text-xs px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700"><i class="fas fa-check mr-1"></i>Tandai Terkirim</button>` : ''}
                            <button onclick="deleteMessage('${msg.id}')" class="text-xs px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700"><i class="fas fa-trash mr-1"></i>Hapus</button>
                        </div>
                    </div>
                `).join('');
            }

            // Invoice messages
            const invMsgBody = document.getElementById('invoice-messages-body');
            if (currentInvoiceMessages.length === 0) {
                invMsgBody.innerHTML = '<div class="px-6 py-8 text-center text-gray-500">Tidak ada pesan invoice</div>';
            } else {
                invMsgBody.innerHTML = currentInvoiceMessages.map(msg => `
                    <div class="px-6 py-4 hover:bg-gray-50 transition">
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <p class="font-medium text-gray-900">${msg.zona_id || 'Unknown'}</p>
                                <p class="text-xs text-gray-500">${new Date(msg.created_at).toLocaleString('id-ID')}</p>
                            </div>
                            <span class="inline-block px-2 py-1 rounded-full text-xs font-medium ${msg.sent_at ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                ${msg.sent_at ? 'Terkirim' : 'Pending'}
                            </span>
                        </div>
                        <div class="text-sm text-gray-600 mb-3 bg-gray-50 p-3 rounded whitespace-pre-wrap">${msg.message || 'N/A'}</div>
                        <div class="flex gap-2">
                            ${!msg.sent_at ? `<button onclick="markInvoiceMessageSent('${msg.id}')" class="text-xs px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700"><i class="fas fa-check mr-1"></i>Tandai Terkirim</button>` : ''}
                            <button onclick="deleteInvoiceMessage('${msg.id}')" class="text-xs px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700"><i class="fas fa-trash mr-1"></i>Hapus</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function markMessageSent(msgId) {
            try {
                await API.post('/api/whatsapp/mark-sent', { notificationId: msgId });
                await loadMessages();
            } catch (err) { alert('Error: ' + err.message); }
        }

        async function markInvoiceMessageSent(msgId) {
            try {
                await API.post('/api/whatsapp/mark-invoice-sent', { notificationId: msgId });
                await loadMessages();
            } catch (err) { alert('Error: ' + err.message); }
        }

        async function deleteMessage(msgId) {
            if (!confirm('Hapus pesan ini?')) return;
            try {
                await API.post('/api/whatsapp/delete-message', { notificationId: msgId });
                await loadMessages();
            } catch (err) { alert('Error: ' + err.message); }
        }

        async function deleteInvoiceMessage(msgId) {
            if (!confirm('Hapus pesan ini?')) return;
            try {
                await API.post('/api/whatsapp/delete-invoice-message', { notificationId: msgId });
                await loadMessages();
            } catch (err) { alert('Error: ' + err.message); }
        }
    </script>
</body>
</html>
