<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Messages - ARSIP ANKA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { zoom: 0.8; }
        
        /* Ensure sidebar is properly positioned */
        #sidebar {
            position: fixed !important;
            left: 0 !important;
            top: 0 !important;
            height: 100vh !important;
            width: 280px !important;
            overflow-y: auto !important;
            z-index: 30 !important;
            background: white !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 0 !important;
        }

        #sidebar > div:first-child {
            padding: 1.5rem;
            border-bottom: 1px solid #f3f4f6;
            flex-shrink: 0;
        }

        #sidebar nav {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        #sidebar .flex {
            display: flex;
        }

        #sidebar .items-center {
            align-items: center;
        }

        #sidebar .gap-3 {
            gap: 0.75rem;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 40px auto; 
            padding: 20px; 
            margin-left: 300px;
        }
        
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }
        
        .message-group { 
            background: #f8f9fa; 
            border-left: 4px solid #25d366; 
            padding: 20px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
        }
        
        .message-group h3 { 
            margin-top: 0; 
            color: #25d366; 
        }
        
        .message-preview { 
            background: white; 
            padding: 15px; 
            border-radius: 6px; 
            margin-top: 15px; 
            border-left: 3px solid #25d366; 
            font-size: 13px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            word-break: break-word; 
            font-family: monospace; 
        }
        
        .badge { 
            display: inline-block; 
            padding: 5px 10px; 
            border-radius: 4px; 
            font-size: 12px; 
            font-weight: 600; 
        }
        
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-sent { background: #d4edda; color: #155724; }
        
        .btn { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.3s; 
            margin-right: 10px; 
        }
        
        .btn-copy { background: #25d366; color: white; }
        .btn-copy:hover { background: #1fa857; }
        .btn-mark-sent { background: #3498db; color: white; }
        .btn-mark-sent:hover { background: #2980b9; }
        
        .no-messages { 
            text-align: center; 
            padding: 40px; 
            color: #7f8c8d; 
        }
        
        .info { 
            background: #d1ecf1; 
            border: 1px solid #bee5eb; 
            color: #0c5460; 
            padding: 15px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
        }
        
        .loading { 
            text-align: center; 
            padding: 40px; 
        }
        
        .spinner { 
            border: 4px solid #e0e0e0; 
            border-top: 4px solid #3498db; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto; 
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        .filter-tabs { 
            margin-bottom: 20px; 
        }
        
        .filter-tabs button { 
            padding: 10px 20px; 
            border: 1px solid #ddd; 
            background: white; 
            cursor: pointer; 
            border-radius: 4px; 
            margin-right: 10px; 
            font-weight: 600; 
        }
        
        .filter-tabs button.active { 
            background: #3498db; 
            color: white; 
            border-color: #3498db; 
        }
    </style>
</head>
<body style="background: #f5f7fa;">
    <div id="sidebar"></div>

    <div class="container">
        <h1>💬 WhatsApp Messages</h1>
        <p style="color: #7f8c8d;">Pesan WhatsApp yang sudah digenerate - siap untuk di copy ke zona group</p>

        <div class="card">
            <div class="info">
                <i class="fas fa-info-circle"></i> 
                Klik tombol "Salin Pesan" untuk copy ke clipboard, lalu paste ke WhatsApp grup zona masing-masing.
                Setelah dikirim, klik "Mark Sent" untuk menandai sebagai sudah dikirim.
            </div>

            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="pending">
                    <i class="fas fa-hourglass-end"></i> Pending (<span id="pendingCount">0</span>)
                </button>
                <button class="filter-btn" data-filter="sent">
                    <i class="fas fa-check-circle"></i> Sent (<span id="sentCount">0</span>)
                </button>
                <button class="filter-btn" data-filter="all">
                    <i class="fas fa-list"></i> All (<span id="allCount">0</span>)
                </button>
            </div>

            <div id="messagesContainer" class="loading">
                <div class="spinner"></div>
                <p>Loading messages...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/sidebar.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>

    <script>
        let allMessages = [];
        let currentFilter = 'pending';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadMessages();
            
            // Add filter event listeners
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderMessages();
                });
            });
        });

        /**
         * Load all pending WhatsApp messages
         */
        async function loadMessages() {
            try {
                const token = API.getToken() || localStorage.getItem('jwt_token');
                
                console.log('[WA-Dashboard] Loading messages...');
                
                const response = await fetch('/api/whatsapp/pending-invoice-messages', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                console.log('[WA-Dashboard] Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                console.log('[WA-Dashboard] Loaded messages:', data);

                if (data.notifications && data.notifications.raw) {
                    allMessages = data.notifications.raw || [];
                    console.log('[WA-Dashboard] Total messages:', allMessages.length);
                } else {
                    allMessages = [];
                }

                updateCounts();
                renderMessages();

            } catch (error) {
                console.error('[WA-Dashboard] Error loading messages:', error);
                document.getElementById('messagesContainer').innerHTML = `
                    <div class="no-messages">
                        <p>❌ Error loading messages: ${error.message}</p>
                        <p style="font-size: 12px; color: #999;">Check console for details</p>
                    </div>
                `;
            }
        }

        /**
         * Render messages based on current filter
         */
        function renderMessages() {
            const container = document.getElementById('messagesContainer');

            let filtered = allMessages;
            if (currentFilter === 'pending') {
                filtered = allMessages.filter(m => !m.sent_at);
            } else if (currentFilter === 'sent') {
                filtered = allMessages.filter(m => m.sent_at);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="no-messages">
                        <i class="fas fa-inbox" style="font-size: 48px; color: #bdc3c7; margin-bottom: 20px; display: block;"></i>
                        <p>Tidak ada pesan</p>
                    </div>
                `;
                return;
            }

            const html = filtered.map(msg => {
                const status = msg.sent_at ? '✅ Sent' : '⏳ Pending';
                const badge = msg.sent_at ? 'badge-sent' : 'badge-pending';
                const zonaName = msg.zonas?.nama || `Zona ${msg.zona_id}`;
                const createdAt = new Date(msg.created_at).toLocaleString('id-ID');

                return `
                    <div class="message-group">
                        <div style="display: flex; justify-content: space-between; align-items: start;">
                            <div>
                                <h3>
                                    <i class="fab fa-whatsapp"></i> ${zonaName}
                                    <span class="badge ${badge}">${status}</span>
                                </h3>
                                <p style="color: #7f8c8d; font-size: 12px; margin: 5px 0;">
                                    <i class="far fa-calendar"></i> ${createdAt}
                                    &nbsp;|&nbsp;
                                    <i class="fas fa-file-pdf"></i> ${msg.invoice_count} invoices
                                </p>
                            </div>
                            <div style="text-align: right;">
                                ${!msg.sent_at ? `
                                    <button class="btn btn-copy" onclick="copyMessage('${escapeJsString(msg.message)}', '${escapeJsString(zonaName)}')">
                                        📋 Copy
                                    </button>
                                    <button class="btn btn-mark-sent" onclick="markSent('${msg.id}')">
                                        ✔️ Mark Sent
                                    </button>
                                ` : `
                                    <button class="btn btn-copy" onclick="copyMessage('${escapeJsString(msg.message)}', '${escapeJsString(zonaName)}')">
                                        📋 Copy
                                    </button>
                                `}
                            </div>
                        </div>
                        <div class="message-preview">${escapeHtml(msg.message)}</div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        /**
         * Copy message to clipboard
         */
        async function copyMessage(message, zonaName) {
            try {
                await navigator.clipboard.writeText(message);
                if (typeof Toast !== 'undefined') {
                    Toast.success(`✅ Pesan zona ${zonaName} sudah disalin!`);
                } else {
                    alert('✅ Pesan sudah disalin ke clipboard!');
                }
            } catch (error) {
                console.error('Copy failed:', error);
                if (typeof Toast !== 'undefined') {
                    Toast.error('❌ Gagal menyalin pesan');
                }
            }
        }

        /**
         * Mark single message as sent
         */
        async function markSent(notificationId) {
            try {
                const token = API.getToken() || localStorage.getItem('jwt_token');
                
                const response = await fetch('/api/whatsapp/mark-invoice-sent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ notificationId })
                });

                if (response.ok) {
                    if (typeof Toast !== 'undefined') {
                        Toast.success('✅ Pesan marked as sent');
                    }
                    await loadMessages(); // Reload
                } else {
                    throw new Error('Failed to mark as sent');
                }
            } catch (error) {
                console.error('Error:', error);
                if (typeof Toast !== 'undefined') {
                    Toast.error('Error marking as sent');
                }
            }
        }

        /**
         * Update message counts
         */
        function updateCounts() {
            const pending = allMessages.filter(m => !m.sent_at).length;
            const sent = allMessages.filter(m => m.sent_at).length;
            const total = allMessages.length;

            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('sentCount').textContent = sent;
            document.getElementById('allCount').textContent = total;
        }

        /**
         * Escape HTML
         */
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        /**
         * Escape for JS string
         */
        function escapeJsString(str) {
            return str.replace(/\\/g, '\\\\')
                      .replace(/'/g, "\\'")
                      .replace(/"/g, '\\"')
                      .replace(/\n/g, '\\n')
                      .replace(/\r/g, '\\r')
                      .replace(/\t/g, '\\t');
        }

        // Auto-refresh every 10 seconds
        setInterval(loadMessages, 10000);
    </script>
</body>
</html>
