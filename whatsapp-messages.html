<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Messages - Pusat Arsip Anka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { zoom: 0.8; }

        .message-group { 
            background: #f8f9fa; 
            border-left: 4px solid #25d366; 
            padding: 20px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
        }
        
        .message-group h3 { 
            margin-top: 0; 
            color: #25d366; 
        }
        
        .message-preview { 
            background: white; 
            padding: 15px; 
            border-radius: 6px; 
            margin-top: 15px; 
            border-left: 3px solid #25d366; 
            font-size: 13px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            word-break: break-word; 
            font-family: monospace;
        }

        .badge { 
            display: inline-block; 
            padding: 5px 10px; 
            border-radius: 4px; 
            font-size: 12px; 
            font-weight: 600; 
        }
        
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-sent { background: #d4edda; color: #155724; }
    </style>
</head>
<body class="bg-gray-50">
    <style>
        body {
            zoom: 0.8;
            transform-origin: top left;
            overflow-x: hidden;
        }
        #app {
            width: 100%;
        }
    </style>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div style="margin-left: 16rem; width: calc(100% - 16rem); transition: all 300ms ease;">
            <!-- Header -->
            <div class="bg-white sticky top-0 z-30 shadow-sm border-b border-gray-100">
                <div class="px-6 py-4">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest">WhatsApp Messages</h2>
                </div>
            </div>

            <!-- Main Content -->
            <div class="p-6 max-w-4xl mx-auto">
                <!-- Page Header -->
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900">WhatsApp Messages</h1>
                    <p class="text-gray-500 font-medium mt-1">Kelola pesan WhatsApp yang digenerate dari sistem</p>
                </div>

                <!-- Info Box -->
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                    <p class="text-blue-800 text-sm">
                        <i class="fas fa-info-circle mr-2"></i>
                        <strong>Informasi:</strong> Lihat daftar pesan WhatsApp yang telah digenerate sistem untuk notifikasi ke zona
                    </p>
                </div>

                <!-- Filter Tabs -->
                <div class="flex gap-3 mb-6">
                    <button class="px-4 py-2 rounded-lg bg-white border border-gray-200 text-gray-600 font-medium hover:border-blue-400 hover:text-blue-600 transition" onclick="filterMessages('all')">
                        Semua
                    </button>
                    <button class="px-4 py-2 rounded-lg bg-white border border-gray-200 text-gray-600 font-medium hover:border-blue-400 hover:text-blue-600 transition" onclick="filterMessages('pending')">
                        Pending
                    </button>
                    <button class="px-4 py-2 rounded-lg bg-white border border-gray-200 text-gray-600 font-medium hover:border-blue-400 hover:text-blue-600 transition" onclick="filterMessages('sent')">
                        Sent
                    </button>
                </div>

                <!-- Messages Container -->
                <div id="messagesContainer" class="space-y-6">
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-inbox text-4xl mb-4 block opacity-25"></i>
                        <p>Memuat pesan WhatsApp...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        function filterMessages(type) {
            console.log('Filtering messages by:', type);
        }
    </script>
</body>
</html>
