<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Knowledge Base | Pusat Arsip Anka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .faq-container { max-width: 1100px; margin: 0 auto; }
        
        /* Search Box Enhanced */
        .search-box { 
            margin-bottom: 24px; 
            position: relative;
        }
        .search-box input { 
            width: 100%; 
            padding: 14px 50px 14px 46px; 
            border: 2px solid #e5e7eb; 
            border-radius: 12px; 
            font-size: 15px;
            transition: all 0.2s;
        }
        .search-box input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
        }
        .clear-search {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 18px;
            display: none;
        }
        .clear-search.show { display: block; }
        
        /* Category Tabs Enhanced */
        .category-tabs { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 24px; 
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .category-btn {
            padding: 10px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 24px;
            background: white;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .category-btn:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        .category-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        /* Sidebar for Popular & Helpful */
        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }
        }
        
        .sidebar-widget {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            position: sticky;
            top: 20px;
        }
        .widget-title {
            font-weight: 700;
            font-size: 14px;
            color: #1f2937;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .widget-item {
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
        }
        .widget-item:last-child { border-bottom: none; }
        .widget-item:hover { color: #3b82f6; }
        .widget-item-title {
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 4px;
        }
        .widget-item-meta {
            font-size: 11px;
            color: #9ca3af;
        }
        
        /* FAQ Item Enhanced */
        .faq-item {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 14px;
            overflow: hidden;
            transition: all 0.2s;
        }
        .faq-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.08);
        }
        .faq-question {
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            gap: 12px;
        }
        .faq-question:hover { background: #f9fafb; }
        .faq-question-text { 
            font-weight: 600; 
            color: #1f2937; 
            font-size: 15px;
            flex: 1;
        }
        .faq-question-text mark {
            background: #fef3c7;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .faq-toggle { 
            font-size: 20px; 
            transition: transform 0.2s; 
            color: #9ca3af;
            flex-shrink: 0;
        }
        .faq-toggle.open { 
            transform: rotate(180deg); 
            color: #3b82f6;
        }
        .faq-answer {
            padding: 0 20px 20px 20px;
            color: #4b5563;
            line-height: 1.8;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            font-size: 14px;
        }
        .faq-answer.open { max-height: 2000px; }
        .faq-answer mark {
            background: #fef3c7;
            padding: 2px 4px;
            border-radius: 3px;
        }
        
        /* Footer Actions */
        .faq-footer {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            flex-wrap: wrap;
        }
        .faq-footer button {
            padding: 8px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            background: white;
            transition: all 0.2s;
            font-weight: 600;
        }
        .faq-footer button:hover { 
            background: #f3f4f6; 
            border-color: #d1d5db;
        }
        .faq-footer button.helpful-yes:hover {
            background: #dcfce7;
            border-color: #86efac;
            color: #166534;
        }
        .faq-footer button.helpful-no:hover {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        
        /* Tags Enhanced */
        .tags {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .tag {
            display: inline-block;
            padding: 5px 10px;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            color: #1e40af;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        
        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-number {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
            font-weight: 600;
        }
        
        /* No Results */
        #no-results {
            text-align: center;
            padding: 60px 20px;
        }
        #no-results .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        #no-results h3 {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }
        #no-results p {
            color: #6b7280;
            font-size: 14px;
        }
        
        /* Print Styles */
        @media print {
            .search-box, .category-tabs, .faq-footer, .sidebar-widget { display: none; }
            .faq-answer { max-height: none !important; }
            .faq-item { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-[#F0F2F5]">
    <aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 flex flex-col z-40"></aside>

    <main id="main-content" class="ml-64 p-8">
        <div class="faq-container">
            <!-- Header -->
            <div class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900">💡 FAQ & Bantuan</h1>
                        <p class="text-gray-600 mt-2">Jawaban untuk pertanyaan umum tentang sistem Arsip ANKA</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="printFAQ()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 text-sm font-semibold">
                            🖨️ Print
                        </button>
                        <button onclick="toggleExpandAll()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-semibold">
                            📖 Expand All
                        </button>
                    </div>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="stats-bar">
                <div class="stat-card">
                    <div class="stat-number" id="stat-total">0</div>
                    <div class="stat-label">Total Artikel</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-categories">0</div>
                    <div class="stat-label">Kategori</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-views">0</div>
                    <div class="stat-label">Total Views</div>
                </div>
            </div>

            <!-- Search Box -->
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Cari artikel, pertanyaan, atau kata kunci..." onkeyup="filterFAQ()">
                <button class="clear-search" onclick="clearSearch()">✕</button>
            </div>

            <!-- Category Tabs -->
            <div class="category-tabs" id="category-tabs"></div>

            <!-- Content Grid -->
            <div class="content-wrapper">
                <!-- Main Content -->
                <div>
                    <div id="faq-items-container"></div>

                    <!-- No Results -->
                    <div id="no-results" class="hidden">
                        <div class="icon">🔍</div>
                        <h3>Tidak ada artikel ditemukan</h3>
                        <p>Coba kata kunci lain atau pilih kategori berbeda</p>
                    </div>
                </div>

                <!-- Sidebar -->
                <div class="sidebar">
                    <!-- Popular Articles -->
                    <div class="sidebar-widget">
                        <div class="widget-title">
                            <span>🔥</span>
                            <span>Paling Populer</span>
                        </div>
                        <div id="popular-articles"></div>
                    </div>

                    <!-- Most Helpful -->
                    <div class="sidebar-widget">
                        <div class="widget-title">
                            <span>⭐</span>
                            <span>Paling Membantu</span>
                        </div>
                        <div id="helpful-articles"></div>
                    </div>

                    <!-- Quick Links -->
                    <div class="sidebar-widget">
                        <div class="widget-title">
                            <span>🔗</span>
                            <span>Quick Links</span>
                        </div>
                        <div style="font-size: 13px; color: #6b7280;">
                            <a href="dashboard.html" style="display: block; padding: 8px 0; color: #3b82f6;">→ Dashboard</a>
                            <a href="upload.html" style="display: block; padding: 8px 0; color: #3b82f6;">→ Upload File</a>
                            <a href="settings.html" style="display: block; padding: 8px 0; color: #3b82f6;">→ Settings</a>
                            <a href="activity-log.html" style="display: block; padding: 8px 0; color: #3b82f6;">→ Activity Log</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js?v=20260828"></script>
    <script src="js/supabase.js?v=20260828"></script>
    <script src="js/auth.js?v=20260828"></script>
    <script src="js/utils.js?v=20260828"></script>
    <script src="js/sidebar.js?v=20260828"></script>

    <script>
        let allArticles = [];
        let allCategories = [];
        let selectedCategory = null;
        let expandedAll = false;

        async function loadFAQ() {
            try {
                // Load categories
                const catRes = await API.get('/api/faq/categories');
                allCategories = catRes.categories || [];

                // Load articles
                const artRes = await API.get('/api/faq/articles');
                allArticles = artRes.articles || [];

                // Load popular articles
                const popRes = await API.get('/api/faq/popular?limit=5');
                renderPopular(popRes.articles || []);

                // Load helpful articles
                const helpRes = await API.get('/api/faq/helpful?limit=5');
                renderHelpful(helpRes.articles || []);

                renderCategories();
                renderArticles();
                updateStats();

            } catch (err) {
                console.error('Error loading FAQ:', err);
                // Use fallback static content if API fails
                loadFallbackContent();
            }
        }

        function loadFallbackContent() {
            // Fallback categories
            allCategories = [
                { id: '1', name: 'Dasar-dasar', icon: '📚', order_number: 1 },
                { id: '2', name: 'Upload & File Management', icon: '📤', order_number: 2 },
                { id: '3', name: 'Pencarian & Filter', icon: '🔍', order_number: 3 },
                { id: '4', name: 'Berbagi File', icon: '🔗', order_number: 4 },
                { id: '5', name: 'Keamanan & Akun', icon: '🔐', order_number: 5 },
                { id: '6', name: 'Troubleshooting', icon: '🔧', order_number: 6 }
            ];

            // Fallback articles (simplified)
            allArticles = [
                {
                    id: '1',
                    category_id: '1',
                    question: 'Apa itu Arsip ANKA?',
                    answer: 'Arsip ANKA adalah sistem manajemen arsip digital yang membantu Anda menyimpan, mengorganisir, dan mengakses file invoice dan dokumen penting dengan aman dan terstruktur.',
                    tags: ['arsip', 'pengenalan'],
                    views: 150,
                    helpful_count: 25,
                    not_helpful_count: 2
                },
                {
                    id: '2',
                    category_id: '2',
                    question: 'Bagaimana cara upload file?',
                    answer: 'Cara upload file:\n1. Klik tombol "Upload" di dashboard atau tekan Ctrl+U\n2. Pilih zona dan toko\n3. Pilih file dari komputer (PDF, JPG, PNG max 50MB)\n4. Isi informasi: nominal, tanggal dokumen, kategori\n5. Klik "Upload"\n6. Tunggu hingga proses selesai',
                    tags: ['upload', 'tutorial'],
                    views: 200,
                    helpful_count: 45,
                    not_helpful_count: 3
                },
                {
                    id: '3',
                    category_id: '6',
                    question: 'Kenapa upload gagal?',
                    answer: 'Penyebab umum:\n1. File terlalu besar (>50MB) - Solusi: Kompres file\n2. Koneksi internet terputus - Solusi: Cek koneksi\n3. Format file tidak didukung - Solusi: Gunakan PDF/JPG/PNG\n4. Storage penuh - Solusi: Hubungi administrator\n5. Browser cache - Solusi: Clear cache',
                    tags: ['upload', 'error', 'troubleshoot'],
                    views: 180,
                    helpful_count: 35,
                    not_helpful_count: 8
                }
            ];

            renderCategories();
            renderArticles();
            updateStats();
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = allArticles.length;
            document.getElementById('stat-categories').textContent = allCategories.length;
            const totalViews = allArticles.reduce((sum, a) => sum + (a.views || 0), 0);
            document.getElementById('stat-views').textContent = totalViews;
        }

        function renderCategories() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = '<button class="category-btn active" onclick="selectCategory(null)">📋 Semua</button>';
            
            allCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.innerHTML = `<span>${cat.icon || '📁'}</span><span>${cat.name}</span>`;
                btn.onclick = () => selectCategory(cat.id);
                container.appendChild(btn);
            });
        }

        function selectCategory(catId) {
            selectedCategory = catId;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.category-btn').classList.add('active');
            renderArticles();
        }

        function filterFAQ() {
            const input = document.getElementById('search-input');
            const clearBtn = document.querySelector('.clear-search');
            
            if (input.value.length > 0) {
                clearBtn.classList.add('show');
            } else {
                clearBtn.classList.remove('show');
            }
            
            renderArticles();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.querySelector('.clear-search').classList.remove('show');
            renderArticles();
        }

        function highlightText(text, search) {
            if (!search) return text;
            const regex = new RegExp(`(${search})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        function renderArticles() {
            let articles = allArticles;

            if (selectedCategory) {
                articles = articles.filter(a => a.category_id === selectedCategory);
            }

            const search = document.getElementById('search-input').value.toLowerCase();
            if (search) {
                articles = articles.filter(a => 
                    a.question.toLowerCase().includes(search) ||
                    a.answer.toLowerCase().includes(search) ||
                    (a.tags && a.tags.some(t => t.toLowerCase().includes(search)))
                );
            }

            const container = document.getElementById('faq-items-container');
            const noResults = document.getElementById('no-results');

            if (articles.length === 0) {
                container.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            container.innerHTML = articles.map((art, idx) => `
                <div class="faq-item" data-id="${art.id}">
                    <div class="faq-question" onclick="toggleAnswer(this)">
                        <span class="faq-question-text">${highlightText(art.question, search)}</span>
                        <span class="faq-toggle">▼</span>
                    </div>
                    <div class="faq-answer">
                        <div>${highlightText(art.answer.split('\n').join('<br>'), search)}</div>
                        ${art.tags && art.tags.length > 0 ? `
                            <div class="tags">
                                ${art.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                            </div>
                        ` : ''}
                        <div class="faq-footer">
                            <button class="helpful-yes" onclick="markHelpful('${art.id}', true, event)">
                                👍 Membantu <span class="count">(${art.helpful_count || 0})</span>
                            </button>
                            <button class="helpful-no" onclick="markHelpful('${art.id}', false, event)">
                                👎 Tidak <span class="count">(${art.not_helpful_count || 0})</span>
                            </button>
                            <button onclick="shareArticle('${art.id}', event)">📤 Share</button>
                            <button onclick="copyArticleLink('${art.id}', event)">🔗 Copy Link</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleAnswer(el) {
            const answer = el.nextElementSibling;
            const toggle = el.querySelector('.faq-toggle');
            const isOpen = answer.classList.contains('open');
            
            answer.classList.toggle('open');
            toggle.classList.toggle('open');

            // Increment views (only on open)
            if (!isOpen) {
                const articleId = el.closest('.faq-item').dataset.id;
                incrementViews(articleId);
            }
        }

        function toggleExpandAll() {
            expandedAll = !expandedAll;
            const btn = event.target;
            
            if (expandedAll) {
                document.querySelectorAll('.faq-answer').forEach(el => el.classList.add('open'));
                document.querySelectorAll('.faq-toggle').forEach(el => el.classList.add('open'));
                btn.textContent = '📕 Collapse All';
            } else {
                document.querySelectorAll('.faq-answer').forEach(el => el.classList.remove('open'));
                document.querySelectorAll('.faq-toggle').forEach(el => el.classList.remove('open'));
                btn.textContent = '📖 Expand All';
            }
        }

        async function incrementViews(articleId) {
            try {
                await API.get(`/api/faq/articles/${articleId}`);
            } catch (err) {
                console.log('Views increment skipped (offline mode)');
            }
        }

        async function markHelpful(articleId, helpful, e) {
            e.stopPropagation();
            try {
                await API.post(`/api/faq/articles/${articleId}/feedback`, { helpful });
                
                // Update count locally
                const article = allArticles.find(a => a.id === articleId);
                if (article) {
                    if (helpful) {
                        article.helpful_count = (article.helpful_count || 0) + 1;
                    } else {
                        article.not_helpful_count = (article.not_helpful_count || 0) + 1;
                    }
                }
                
                renderArticles();
                
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'Terima kasih atas feedback Anda!',
                    showConfirmButton: false,
                    timer: 2000
                });
            } catch (err) {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'info',
                    title: 'Feedback tersimpan secara lokal',
                    showConfirmButton: false,
                    timer: 2000
                });
            }
        }

        function shareArticle(articleId, e) {
            e.stopPropagation();
            const article = allArticles.find(a => a.id === articleId);
            if (!article) return;

            if (navigator.share) {
                navigator.share({
                    title: article.question,
                    text: article.answer.substring(0, 200),
                    url: window.location.href + '#' + articleId
                });
            } else {
                copyArticleLink(articleId, e);
            }
        }

        function copyArticleLink(articleId, e) {
            e.stopPropagation();
            const url = window.location.origin + window.location.pathname + '#' + articleId;
            navigator.clipboard.writeText(url).then(() => {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'Link copied to clipboard!',
                    showConfirmButton: false,
                    timer: 2000
                });
            });
        }

        function renderPopular(articles) {
            const container = document.getElementById('popular-articles');
            if (!articles || articles.length === 0) {
                container.innerHTML = '<p style="font-size: 12px; color: #9ca3af;">No data</p>';
                return;
            }
            
            container.innerHTML = articles.slice(0, 5).map(art => `
                <div class="widget-item" onclick="scrollToArticle('${art.id}')">
                    <div class="widget-item-title">${art.question.substring(0, 60)}${art.question.length > 60 ? '...' : ''}</div>
                    <div class="widget-item-meta">👁️ ${art.views || 0} views</div>
                </div>
            `).join('');
        }

        function renderHelpful(articles) {
            const container = document.getElementById('helpful-articles');
            if (!articles || articles.length === 0) {
                container.innerHTML = '<p style="font-size: 12px; color: #9ca3af;">No data</p>';
                return;
            }
            
            container.innerHTML = articles.slice(0, 5).map(art => `
                <div class="widget-item" onclick="scrollToArticle('${art.id}')">
                    <div class="widget-item-title">${art.question.substring(0, 60)}${art.question.length > 60 ? '...' : ''}</div>
                    <div class="widget-item-meta">👍 ${art.helpful_count || 0} helpful</div>
                </div>
            `).join('');
        }

        function scrollToArticle(articleId) {
            const item = document.querySelector(`.faq-item[data-id="${articleId}"]`);
            if (item) {
                item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                item.querySelector('.faq-question').click();
                item.style.backgroundColor = '#eff6ff';
                setTimeout(() => {
                    item.style.backgroundColor = '';
                }, 2000);
            }
        }

        function printFAQ() {
            // Expand all before print
            document.querySelectorAll('.faq-answer').forEach(el => el.classList.add('open'));
            window.print();
        }

        // Check for hash on load (direct link to article)
        function checkHash() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                setTimeout(() => scrollToArticle(hash), 500);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadFAQ();
            checkHash();
        });
    </script>
</body>
</html>
