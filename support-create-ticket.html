<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buka Tiket Support - Pusat Arsip Anka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #1f2937;
            font-size: 14px;
        }
        
        .form-required {
            color: #ef4444;
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            transition: all 0.2s;
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
        }
        
        .form-textarea {
            min-height: 140px;
            resize: vertical;
        }
        
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafbfc;
        }
        
        .upload-area:hover {
            border-color: #4f46e5;
            background: #f0f4ff;
        }
        
        .upload-area.active {
            border-color: #4f46e5;
            background: #f0f4ff;
        }
        
        .upload-icon {
            font-size: 32px;
            margin-bottom: 8px;
            color: #9ca3af;
        }
        
        .upload-text {
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
        }
        
        .upload-hint {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #f3f4f6;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .file-item-name {
            color: #1f2937;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .file-item-size {
            color: #9ca3af;
            margin-left: 8px;
            font-size: 12px;
        }
        
        .file-remove-btn {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 4px 6px;
            margin-left: 8px;
            transition: color 0.2s;
        }
        
        .file-remove-btn:hover {
            color: #ef4444;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }
        
        .btn {
            padding: 11px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: #4f46e5;
            color: white;
            flex: 1;
        }
        
        .btn-primary:hover {
            background: #4338ca;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
            flex: 1;
        }
        
        .btn-secondary:hover {
            background: #d1d5db;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: #6b7280;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            text-decoration: none;
        }
        
        .back-btn:hover {
            background: #f9fafb;
            color: #1f2937;
        }
        
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .divider {
            height: 1px;
            background: #e5e7eb;
            margin: 24px 0;
        }
        
        .form-hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
        }
        
        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div style="min-height: 100vh; background: #f5f7fa;">
        <!-- Header -->
        <div style="background: white; border-bottom: 1px solid #e5e7eb; padding: 20px 0;">
            <div class="max-w-3xl mx-auto px-6">
                <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 16px;">
                    <a href="/support-dashboard-customer" class="back-btn" title="Back">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <div>
                        <h1 style="font-size: 24px; font-weight: 700; color: #1f2937; margin: 0;">Buka Tiket Support</h1>
                        <p style="color: #6b7280; font-size: 13px; margin: 6px 0 0 0;">Isi form di bawah untuk menghubungi tim support kami</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="max-w-3xl mx-auto px-6 py-8">
            <form id="createTicketForm" onsubmit="submitTicket(event)">
                <!-- Department & Priority -->
                <div class="two-column">
                    <div class="form-group">
                        <label class="form-label">
                            Departemen <span class="form-required">*</span>
                        </label>
                        <select id="formCategory" class="form-select" required>
                            <option value="">Pilih departemen...</option>
                            <option value="General">General</option>
                            <option value="Technical">Technical Support</option>
                            <option value="Billing">Billing</option>
                            <option value="Data">Data Issue</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Prioritas</label>
                        <select id="formPriority" class="form-select">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                            <option value="Urgent">Urgent</option>
                        </select>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Subject -->
                <div class="form-group">
                    <label class="form-label">
                        Subjek <span class="form-required">*</span>
                    </label>
                    <input type="text" id="formSubject" class="form-input" placeholder="Ringkas masalah Anda" required>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label class="form-label">
                        Penjelasan <span class="form-required">*</span>
                    </label>
                    <textarea id="formDescription" class="form-textarea" placeholder="Jelaskan masalah atau pertanyaan Anda secara detail..." required></textarea>
                    <div class="form-hint">Tulis penjelasan yang jelas dan detail agar kami dapat membantu lebih baik</div>
                </div>

                <div class="divider"></div>

                <!-- File Upload -->
                <div class="form-group">
                    <label class="form-label">Lampiran (Opsional)</label>
                    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click();">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-arrow-up"></i>
                        </div>
                        <div class="upload-text">Drag & drop atau klik untuk upload file</div>
                        <div class="upload-hint">Max. 5 file, 2MB per file (JPG, PNG, PDF)</div>
                        <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.pdf" style="display: none;" onchange="handleFileSelect(event)">
                    </div>
                    <div id="fileList" style="margin-top: 12px;"></div>
                </div>

                <!-- Divider before buttons -->
                <div class="divider"></div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='/support-dashboard-customer';">
                        Batal
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Kirim Tiket
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let selectedFiles = [];

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[Support-Create] Page loaded');
            await initAuth();
            
            if (!currentUser) {
                document.body.innerHTML = '<div style="padding: 20px; color: red;">Error: Failed to authenticate</div>';
                return;
            }
            
            if (currentUser.role !== 'admin_zona' && currentUser.role !== 'super_admin') {
                window.location.href = '/support-dashboard';
                return;
            }

            // Drag and drop
            const uploadArea = document.getElementById('uploadArea');
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('active');
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('active');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('active');
                const files = Array.from(e.dataTransfer.files);
                selectedFiles = [...selectedFiles, ...files].slice(0, 5);
                displayFileList();
            });
        });

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            selectedFiles = [...selectedFiles, ...files].slice(0, 5);
            displayFileList();
        }

        function displayFileList() {
            const fileList = document.getElementById('fileList');
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '';
                return;
            }
            
            fileList.innerHTML = selectedFiles.map((file, idx) => `
                <div class="file-item">
                    <i class="fas fa-file" style="color: #6b7280; margin-right: 8px;"></i>
                    <span class="file-item-name">${file.name}</span>
                    <span class="file-item-size">${(file.size / 1024).toFixed(1)}KB</span>
                    <button type="button" class="file-remove-btn" onclick="removeFile(${idx});" title="Hapus">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        function removeFile(idx) {
            selectedFiles.splice(idx, 1);
            displayFileList();
        }

        async function submitTicket(e) {
            e.preventDefault();
            
            try {
                const token = localStorage.getItem('jwt_token');
                const subject = document.getElementById('formSubject').value;
                const description = document.getElementById('formDescription').value;
                const category = document.getElementById('formCategory').value;
                const priority = document.getElementById('formPriority').value;

                if (!subject || !description) {
                    alert('Silakan isi semua field yang diperlukan');
                    return;
                }

                console.log('[Support-Create] Creating ticket:', { subject, category, priority });

                const response = await fetch('/api/support/tickets', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        subject,
                        description,
                        category,
                        priority
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to create ticket');
                }

                const data = await response.json();
                console.log('[Support-Create] Ticket created:', data.ticket.ticket_number);

                alert(`✓ ${data.ticket.ticket_number} berhasil dibuat!`);
                window.location.href = `/support-dashboard-customer`;

            } catch (error) {
                console.error('[Support-Create] Error:', error);
                alert(`Error: ${error.message}`);
            }
        }
    </script>
</body>
</html>
