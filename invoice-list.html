<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Invoice - ARSIP ANKA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .invoice-container {
            padding: 30px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .invoice-header h1 {
            font-size: 28px;
            color: #2c3e50;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn-upload-excel {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-upload-excel:hover {
            background: #229954;
            transform: translateY(-2px);
        }

        .btn-refresh {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-refresh:hover {
            background: #2980b9;
        }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        .stat-card.total .stat-value { color: #3498db; }
        .stat-card.uploaded .stat-value { color: #27ae60; }
        .stat-card.pending .stat-value { color: #f39c12; }
        .stat-card.missing .stat-value { color: #e74c3c; }

        /* Filters */
        .filters-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px;
            border: 2px solid #ecf0f1;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-filter {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn-filter:hover {
            background: #2980b9;
        }

        .btn-reset {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-reset:hover {
            background: #7f8c8d;
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .invoice-table {
            width: 100%;
            border-collapse: collapse;
        }

        .invoice-table thead {
            background: #34495e;
            color: white;
        }

        .invoice-table th {
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .invoice-table tbody tr {
            border-bottom: 1px solid #ecf0f1;
            transition: background 0.2s;
        }

        .invoice-table tbody tr:hover {
            background: #f8f9fa;
        }

        .invoice-table td {
            padding: 15px 12px;
            font-size: 14px;
            color: #2c3e50;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.uploaded {
            background: #d5f4e6;
            color: #27ae60;
        }

        .status-badge.pending {
            background: #fff3cd;
            color: #f39c12;
        }

        .status-badge.missing {
            background: #fadbd8;
            color: #e74c3c;
        }

        /* Upload Button in Row */
        .btn-upload-pdf {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-upload-pdf:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .btn-upload-pdf:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-view-file {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-view-file:hover {
            background: #2980b9;
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: white;
            border-top: 2px solid #ecf0f1;
        }

        .pagination-info {
            color: #7f8c8d;
            font-size: 14px;
        }

        .pagination-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-page {
            background: white;
            border: 2px solid #3498db;
            color: #3498db;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-page:hover {
            background: #3498db;
            color: white;
        }

        .btn-page:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.visible {
            display: flex;
        }

        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .loading-spinner i {
            font-size: 48px;
            color: #3498db;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            color: #bdc3c7;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        /* Currency Format */
        .currency {
            font-weight: 600;
            color: #27ae60;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .invoice-table {
                font-size: 12px;
            }
            
            .invoice-table th,
            .invoice-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="invoice-container">
            <!-- Header -->
            <div class="invoice-header">
                <h1><i class="fas fa-file-invoice"></i> Daftar Invoice</h1>
                <div class="header-actions">
                    <button class="btn-upload-excel" onclick="uploadBulkPDFs()" style="background: #e74c3c;">
                        <i class="fas fa-file-pdf"></i> Upload PDF Massal
                    </button>
                    <button class="btn-refresh" onclick="location.reload()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-container">
                <div class="stat-card total">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Total Invoice</div>
                </div>
                <div class="stat-card uploaded">
                    <div class="stat-value" id="statUploaded">0</div>
                    <div class="stat-label">Uploaded</div>
                </div>
                <div class="stat-card pending">
                    <div class="stat-value" id="statPending">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-card missing">
                    <div class="stat-value" id="statMissing">0</div>
                    <div class="stat-label">Missing</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-container">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label>Status</label>
                        <select id="filterStatus">
                            <option value="">Semua Status</option>
                            <option value="PENDING">Pending</option>
                            <option value="UPLOADED">Uploaded</option>
                            <option value="MISSING">Missing</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Toko</label>
                        <select id="filterToko">
                            <option value="">Semua Toko</option>
                            <option value="ANKA BEKASI">ANKA BEKASI</option>
                            <option value="ANKA PEMALANG">ANKA PEMALANG</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Keterangan</label>
                        <select id="filterKeterangan">
                            <option value="">Semua</option>
                            <option value="PPN">PPN</option>
                            <option value="NON PPN">NON PPN</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Dari Tanggal</label>
                        <input type="date" id="filterDateFrom">
                    </div>
                    <div class="filter-group">
                        <label>Sampai Tanggal</label>
                        <input type="date" id="filterDateTo">
                    </div>
                    <div class="filter-group">
                        <label>Cari (Faktur/Konsumen)</label>
                        <input type="text" id="filterSearch" placeholder="Cari...">
                    </div>
                </div>
                <div class="filter-actions">
                    <button class="btn-reset" id="btnResetFilter">
                        <i class="fas fa-redo"></i> Reset
                    </button>
                    <button class="btn-filter" id="btnApplyFilter">
                        <i class="fas fa-filter"></i> Terapkan Filter
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table class="invoice-table">
                    <thead>
                        <tr>
                            <th>Attachments</th>
                            <th>Tanggal</th>
                            <th>No Faktur</th>
                            <th>Status Bayar</th>
                            <th>Tipe</th>
                            <th>Nama Konsumen</th>
                            <th>Nama Toko</th>
                            <th>Total</th>
                            <th>Keterangan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceTableBody">
                        <!-- Will be populated by JavaScript -->
                    </tbody>
                </table>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <i class="fas fa-inbox"></i>
                    <h3>Belum Ada Data</h3>
                    <p>Silakan upload file Excel terlebih dahulu</p>
                </div>

                <!-- Pagination -->
                <div class="pagination-container" id="paginationContainer">
                    <div class="pagination-info" id="paginationInfo">
                        Menampilkan 0 - 0 dari 0 invoice
                    </div>
                    <div class="pagination-buttons">
                        <button class="btn-page" id="btnPrevPage">
                            <i class="fas fa-chevron-left"></i> Sebelumnya
                        </button>
                        <button class="btn-page" id="btnNextPage">
                            Selanjutnya <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <i class="fas fa-circle-notch"></i>
            <p style="margin-top: 15px;">Memuat data...</p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/invoice-list.js"></script>
</body>
</html>
