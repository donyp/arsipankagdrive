<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Backups - Pusat Arsip Anka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status-completed { background-color: #d1fae5; color: #065f46; }
        .status-pending { background-color: #fef3c7; color: #92400e; }
        .status-in_progress { background-color: #dbeafe; color: #0c2d6b; }
        .status-failed { background-color: #fee2e2; color: #7f1d1d; }
        .status-archived { background-color: #e5e7eb; color: #374151; }
        
        .verified-badge {
            background-color: #dbeafe;
            color: #0c2d6b;
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .modal { display: none; }
        .modal.active { display: block; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
        
        .loading-spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 2rem;
            height: 2rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .timeline {
            position: relative;
            padding-left: 2rem;
        }
        
        .timeline-item {
            position: relative;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            border-left: 2px solid #e5e7eb;
            padding-left: 1.5rem;
        }
        
        .timeline-item:last-child {
            border-left: none;
        }
        
        .timeline-dot {
            position: absolute;
            left: -0.625rem;
            top: 0;
            width: 1rem;
            height: 1rem;
            background: white;
            border: 2px solid #3b82f6;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" class="min-h-screen">
        <!-- Sidebar will be injected here -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="ml-0 lg:ml-64 transition-all duration-300">
            <!-- Top Navigation -->
            <div class="bg-white border-b border-gray-200 sticky top-0 z-40">
                <div class="px-6 py-4 flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Database Backups</h1>
                        <p class="text-sm text-gray-500 mt-1">Manage and monitor database backups</p>
                    </div>
                    <button onclick="openCreateBackupModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition">
                        <i class="fas fa-plus"></i> New Backup
                    </button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="p-6 max-w-7xl">
                <!-- Statistics Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-gray-500 text-sm font-medium">Total Backups</p>
                                <p class="text-3xl font-bold text-gray-900 mt-2" id="stat-total">0</p>
                            </div>
                            <div class="bg-blue-100 p-3 rounded-lg">
                                <i class="fas fa-database text-blue-600 text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-gray-500 text-sm font-medium">Completed</p>
                                <p class="text-3xl font-bold text-green-600 mt-2" id="stat-completed">0</p>
                            </div>
                            <div class="bg-green-100 p-3 rounded-lg">
                                <i class="fas fa-check-circle text-green-600 text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-gray-500 text-sm font-medium">Failed</p>
                                <p class="text-3xl font-bold text-red-600 mt-2" id="stat-failed">0</p>
                            </div>
                            <div class="bg-red-100 p-3 rounded-lg">
                                <i class="fas fa-exclamation-circle text-red-600 text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-gray-500 text-sm font-medium">Total Size</p>
                                <p class="text-2xl font-bold text-gray-900 mt-2" id="stat-size">0 GB</p>
                            </div>
                            <div class="bg-purple-100 p-3 rounded-lg">
                                <i class="fas fa-hdd text-purple-600 text-xl"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Backups Table -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-gray-900">All Backups</h2>
                        <div class="flex gap-2">
                            <select id="filterStatus" onchange="applyFilters()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">All Status</option>
                                <option value="completed">Completed</option>
                                <option value="pending">Pending</option>
                                <option value="in_progress">In Progress</option>
                                <option value="failed">Failed</option>
                            </select>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Backup Name</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Size</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Verified</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="backupsTable" class="divide-y divide-gray-200">
                                <!-- Backups will be loaded here -->
                                <tr>
                                    <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                                        <div class="loading-spinner mx-auto mb-2"></div>
                                        Loading backups...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Backup Modal -->
    <div id="createBackupModal" class="modal fixed inset-0 z-50 flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-lg shadow-lg max-w-md w-full mx-4">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-900">Create New Backup</h2>
                <button onclick="closeCreateBackupModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="px-6 py-4">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Notes (Optional)</label>
                    <textarea id="backupNotes" placeholder="Add notes about this backup..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" rows="4"></textarea>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
                <button onclick="closeCreateBackupModal()" class="px-4 py-2 text-gray-700 hover:text-gray-900">Cancel</button>
                <button onclick="createBackup()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">Create Backup</button>
            </div>
        </div>
    </div>

    <!-- Backup Details Modal -->
    <div id="detailsModal" class="modal fixed inset-0 z-50 flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 max-h-96 overflow-y-auto">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center sticky top-0 bg-white">
                <h2 class="text-lg font-semibold text-gray-900">Backup Details</h2>
                <button onclick="closeDetailsModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="detailsContent" class="px-6 py-4">
                <!-- Audit log timeline will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal fixed inset-0 z-50 flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-lg shadow-lg max-w-md w-full mx-4">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Confirm Action</h2>
            </div>
            <div class="px-6 py-4">
                <p id="confirmMessage" class="text-gray-700"></p>
            </div>
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
                <button onclick="closeConfirmModal()" class="px-4 py-2 text-gray-700 hover:text-gray-900">Cancel</button>
                <button id="confirmBtn" onclick="executeConfirmedAction()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 max-w-sm z-50"></div>

    <script src="js/sidebar.js"></script>
    <script>
        let currentPage = 1;
        let currentLimit = 20;
        let allBackups = [];
        let pendingAction = null;

        // ============================================================
        // Initialize Page
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            await loadSidebar('admin-database-backups.html');
            await loadBackups();
            setInterval(loadBackups, 30000); // Refresh every 30 seconds
        });

        // ============================================================
        // Load Backups
        // ============================================================
        async function loadBackups() {
            try {
                const response = await fetch('/api/backup/list?limit=100&offset=0', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                if (!response.ok) throw new Error('Failed to load backups');

                const data = await response.json();
                allBackups = data.backups || [];

                // Load stats
                const statsResponse = await fetch('/api/backup/stats', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                if (statsResponse.ok) {
                    const statsData = await statsResponse.json();
                    updateStatistics(statsData.stats);
                }

                // Render backups
                renderBackups(allBackups);
            } catch (err) {
                console.error('[Backups] Load error:', err);
                showToast('Failed to load backups: ' + err.message, 'error');
            }
        }

        // ============================================================
        // Render Backups Table
        // ============================================================
        function renderBackups(backups) {
            const table = document.getElementById('backupsTable');

            if (backups.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p class="mt-2">No backups found</p>
                        </td>
                    </tr>
                `;
                return;
            }

            table.innerHTML = backups.map(backup => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 text-sm font-medium text-gray-900">${backup.backup_name}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${formatDate(backup.backup_timestamp)}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${formatBytes(backup.backup_size_bytes)}</td>
                    <td class="px-6 py-4 text-sm">
                        <span class="status-badge status-${backup.status}">
                            ${backup.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm">
                        ${backup.is_verified ? `<span class="verified-badge"><i class="fas fa-check"></i> Verified</span>` : '-'}
                    </td>
                    <td class="px-6 py-4 text-sm text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick="viewDetails('${backup.id}')" class="text-blue-600 hover:text-blue-800 transition" title="View Details">
                                <i class="fas fa-eye"></i>
                            </button>
                            ${backup.status === 'completed' && !backup.is_verified ? `
                                <button onclick="verifyBackup('${backup.id}')" class="text-green-600 hover:text-green-800 transition" title="Verify">
                                    <i class="fas fa-check-circle"></i>
                                </button>
                            ` : ''}
                            <button onclick="confirmDelete('${backup.id}')" class="text-red-600 hover:text-red-800 transition" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // ============================================================
        // Update Statistics
        // ============================================================
        function updateStatistics(stats) {
            document.getElementById('stat-total').textContent = stats.totalBackups || 0;
            document.getElementById('stat-completed').textContent = stats.completedBackups || 0;
            document.getElementById('stat-failed').textContent = stats.failedBackups || 0;
            document.getElementById('stat-size').textContent = formatBytes(stats.totalSizeBytes);
        }

        // ============================================================
        // Create Backup
        // ============================================================
        async function createBackup() {
            try {
                const notes = document.getElementById('backupNotes').value;

                const response = await fetch('/api/backup/create', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ notes })
                });

                if (!response.ok) throw new Error('Failed to create backup');

                const data = await response.json();
                closeCreateBackupModal();
                showToast('Backup initiated successfully. ID: ' + data.backupId, 'success');
                
                // Reload backups after a delay
                setTimeout(loadBackups, 2000);
            } catch (err) {
                console.error('[Backups] Create error:', err);
                showToast('Failed to create backup: ' + err.message, 'error');
            }
        }

        // ============================================================
        // Verify Backup
        // ============================================================
        async function verifyBackup(backupId) {
            try {
                const response = await fetch(`/api/backup/verify/${backupId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                if (!response.ok) throw new Error('Failed to verify backup');

                showToast('Backup verified successfully', 'success');
                loadBackups();
            } catch (err) {
                console.error('[Backups] Verify error:', err);
                showToast('Failed to verify backup: ' + err.message, 'error');
            }
        }

        // ============================================================
        // View Details
        // ============================================================
        async function viewDetails(backupId) {
            try {
                const response = await fetch(`/api/backup/info/${backupId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                if (!response.ok) throw new Error('Failed to load backup details');

                const data = await response.json();
                const backup = data.backup;
                const auditLog = data.auditLog || [];

                let auditHtml = '<div class="space-y-6">';
                auditHtml += `
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <h3 class="font-semibold text-gray-900 mb-3">Backup Information</h3>
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div><span class="text-gray-600">Name:</span> ${backup.backup_name}</div>
                            <div><span class="text-gray-600">Status:</span> <span class="status-badge status-${backup.status}">${backup.status}</span></div>
                            <div><span class="text-gray-600">Date:</span> ${formatDate(backup.backup_timestamp)}</div>
                            <div><span class="text-gray-600">Size:</span> ${formatBytes(backup.backup_size_bytes)}</div>
                            <div><span class="text-gray-600">Type:</span> ${backup.backup_type}</div>
                            <div><span class="text-gray-600">Verified:</span> ${backup.is_verified ? '<span class="verified-badge"><i class="fas fa-check"></i> Yes</span>' : 'No'}</div>
                        </div>
                    </div>
                `;

                if (backup.notes) {
                    auditHtml += `
                        <div class="bg-blue-50 p-4 rounded-lg">
                            <h4 class="font-semibold text-gray-900 mb-2">Notes</h4>
                            <p class="text-sm text-gray-700">${backup.notes}</p>
                        </div>
                    `;
                }

                if (auditLog.length > 0) {
                    auditHtml += '<div><h4 class="font-semibold text-gray-900 mb-3">Audit Trail</h4>';
                    auditHtml += '<div class="timeline">';
                    
                    auditLog.forEach(log => {
                        auditHtml += `
                            <div class="timeline-item">
                                <div class="timeline-dot"></div>
                                <div>
                                    <p class="font-medium text-gray-900">${capitalizeFirst(log.operation)}</p>
                                    <p class="text-xs text-gray-600 mt-1">${formatDate(log.timestamp)}</p>
                                    ${log.performed_by ? `<p class="text-xs text-gray-600">By: ${log.performed_by.name}</p>` : ''}
                                </div>
                            </div>
                        `;
                    });
                    
                    auditHtml += '</div></div>';
                }

                auditHtml += '</div>';

                document.getElementById('detailsContent').innerHTML = auditHtml;
                document.getElementById('detailsModal').classList.add('active');
            } catch (err) {
                console.error('[Backups] Details error:', err);
                showToast('Failed to load backup details: ' + err.message, 'error');
            }
        }

        // ============================================================
        // Delete Backup
        // ============================================================
        function confirmDelete(backupId) {
            pendingAction = { type: 'delete', backupId };
            const backup = allBackups.find(b => b.id === backupId);
            document.getElementById('confirmMessage').textContent = 
                `Are you sure you want to delete the backup "${backup?.backup_name}"? This action cannot be undone.`;
            document.getElementById('confirmModal').classList.add('active');
        }

        async function executeConfirmedAction() {
            if (!pendingAction) return;

            try {
                if (pendingAction.type === 'delete') {
                    const response = await fetch(`/api/backup/delete/${pendingAction.backupId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ reason: 'Deleted by admin' })
                    });

                    if (!response.ok) throw new Error('Failed to delete backup');

                    showToast('Backup deleted successfully', 'success');
                    loadBackups();
                }
            } catch (err) {
                console.error('[Backups] Action error:', err);
                showToast('Failed to execute action: ' + err.message, 'error');
            } finally {
                closeConfirmModal();
                pendingAction = null;
            }
        }

        // ============================================================
        // Apply Filters
        // ============================================================
        function applyFilters() {
            const status = document.getElementById('filterStatus').value;
            const filtered = status ? allBackups.filter(b => b.status === status) : allBackups;
            renderBackups(filtered);
        }

        // ============================================================
        // Modal Controls
        // ============================================================
        function openCreateBackupModal() {
            document.getElementById('backupNotes').value = '';
            document.getElementById('createBackupModal').classList.add('active');
        }

        function closeCreateBackupModal() {
            document.getElementById('createBackupModal').classList.remove('active');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }

        // ============================================================
        // Utilities
        // ============================================================
        function formatDate(timestamp) {
            return new Date(timestamp).toLocaleString('id-ID', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1).replace(/_/g, ' ');
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';

            toast.innerHTML = `
                <div class="bg-white rounded-lg shadow-lg p-4 flex items-center gap-3">
                    <div class="${bgColor} text-white p-2 rounded-full">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-gray-900 font-medium">${message}</p>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;

            setTimeout(() => {
                if (toast.firstChild) {
                    toast.firstChild.remove();
                }
            }, 5000);
        }

        // Close modals when clicking outside
        document.addEventListener('click', (e) => {
            if (e.target.id === 'createBackupModal') closeCreateBackupModal();
            if (e.target.id === 'detailsModal') closeDetailsModal();
            if (e.target.id === 'confirmModal') closeConfirmModal();
        });
    </script>
</body>
</html>
