<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Detail - Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        
        .ticket-info-box {
            background: white;
            border-left: 4px solid #e74c3c;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        
        .info-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .info-label {
            font-weight: 600;
            color: #4b5563;
        }
        
        .info-value {
            color: #1f2937;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-open { background: #fef2f2; color: #dc2626; }
        .status-in-progress { background: #fef3c7; color: #d97706; }
        .status-answered { background: #f0fdf4; color: #16a34a; }
        .status-resolved { background: #f0f9ff; color: #0284c7; }
        .status-closed { background: #f3f4f6; color: #4b5563; }
        
        .priority-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .priority-low { background: #e0e7ff; color: #3730a3; }
        .priority-medium { background: #fef3c7; color: #92400e; }
        .priority-high { background: #fecaca; color: #7f1d1d; }
        .priority-urgent { background: #fca5a5; color: #7f1d1d; }
        
        .message-box {
            background: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #e5e7eb;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .message-meta {
            font-size: 13px;
            color: #6b7280;
        }
        
        .message-content {
            color: #1f2937;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .internal-note {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
        }
        
        .internal-badge {
            display: inline-block;
            background: #f59e0b;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .attachment-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: #f9fafb;
            border-radius: 4px;
            margin-top: 8px;
        }
        
        .attachment-icon {
            width: 32px;
            height: 32px;
            background: #e5e7eb;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #4b5563;
        }
        
        .attachment-name {
            flex: 1;
            font-size: 13px;
            color: #1f2937;
            font-weight: 500;
            word-break: break-all;
        }
        
        .attachment-download {
            color: #e74c3c;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
        }
        
        .attachment-download:hover {
            text-decoration: underline;
        }
        
        .reply-form {
            background: white;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1f2937;
        }
        
        .form-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            min-height: 120px;
            resize: vertical;
        }
        
        .form-textarea:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #e74c3c;
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #c0392b;
        }
        
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #4b5563;
        }
        
        .btn-danger {
            background: #dc2626;
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            background: #b91c1c;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f4f6;
            border-top: 3px solid #e74c3c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            cursor: pointer;
            font-size: 14px;
            color: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div style="margin-left: 16rem; width: calc(100% - 16rem); transition: all 300ms ease;">
            <!-- Header -->
            <div class="gradient-header text-white sticky top-0 z-30 shadow-lg">
                <div class="px-6 py-6 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <button onclick="goBackToList()" class="bg-white/20 hover:bg-white/30 p-2 rounded-lg transition">
                            <i class="fas fa-arrow-left text-lg"></i>
                        </button>
                        <div>
                            <h1 class="text-2xl font-bold" id="ticketTitle">Ticket Loading...</h1>
                            <p class="text-red-100 text-sm" id="ticketStatus">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="p-6">
                <!-- Ticket Info -->
                <div class="ticket-info-box" id="ticketInfoBox">
                    <div class="info-row">
                        <div class="info-label">Nomor Tiket</div>
                        <div class="info-value" id="ticketNumber">#ANKA000</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Status</div>
                        <div class="info-value">
                            <span class="status-badge" id="statusBadge">Open</span>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Prioritas</div>
                        <div class="info-value">
                            <span class="priority-badge" id="priorityBadge">Medium</span>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Kategori</div>
                        <div class="info-value" id="categoryValue">General</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Dibuat</div>
                        <div class="info-value" id="createdDate">-</div>
                    </div>
                    <div class="info-row" style="border-bottom: none;">
                        <div class="info-label">Aksi</div>
                        <div class="info-value flex gap-2">
                            <button id="btnResolve" class="btn btn-primary btn-small" onclick="resolveTicket()" style="display: none;">
                                <i class="fas fa-check"></i> Tandai Selesai
                            </button>
                            <button id="btnClose" class="btn btn-secondary btn-small" onclick="closeTicket()" style="display: none;">
                                <i class="fas fa-lock"></i> Close
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Ticket Content -->
                <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4" id="ticketSubject">Subject</h3>
                    <div class="text-gray-700 mb-4" id="ticketDescription" style="white-space: pre-wrap; word-wrap: break-word;">Description</div>
                    
                    <div id="ticketAttachmentsContainer" style="display: none;">
                        <h4 class="font-bold text-gray-700 mt-4 mb-3">Lampiran</h4>
                        <div id="ticketAttachments"></div>
                    </div>
                </div>

                <!-- Messages -->
                <div class="mb-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Percakapan</h3>
                    <div id="messagesContainer" style="min-height: 100px;">
                        <div style="text-align: center; color: #6b7280; padding: 40px;">
                            <div class="loading-spinner" style="margin: 0 auto 15px;"></div>
                            Loading messages...
                        </div>
                    </div>
                </div>

                <!-- Reply Form -->
                <div class="reply-form" id="replyFormContainer">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Balas Tiket</h3>
                    
                    <form id="replyForm" onsubmit="submitReply(event)">
                        <div class="form-group">
                            <label class="form-label">Pesan Anda</label>
                            <textarea class="form-textarea" id="replyMessage" required placeholder="Tulis balasan Anda di sini..."></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Lampiran (Opsional)</label>
                            <input type="file" id="replyAttachment" class="form-input" accept="*/*">
                            <p class="text-xs text-gray-500 mt-2">Ukuran maks: 10MB</p>
                        </div>

                        <div class="checkbox-group" id="internalNoteGroup" style="display: none;">
                            <input type="checkbox" id="isInternalNote">
                            <label for="isInternalNote">Catatan Internal (hanya terlihat oleh support staff)</label>
                        </div>

                        <div class="flex gap-3 mt-6">
                            <button type="submit" class="btn btn-primary flex-1" id="btnSendReply">
                                <i class="fas fa-paper-plane"></i> Kirim Balasan
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/support-detail.js"></script>
</body>
</html>
