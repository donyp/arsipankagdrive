<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Tiket - Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f9fafb;
        }
        
        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .back-btn:hover {
            color: #1f2937;
        }
        
        .page-title {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .ticket-number {
            font-size: 13px;
            color: #9ca3af;
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }
        
        .ticket-subject {
            font-size: 28px;
            font-weight: 700;
            color: #1f2937;
        }
        
        .ticket-status-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6b7280;
        }
        
        .status-text {
            color: #6b7280;
            font-size: 13px;
            font-weight: 500;
        }
        
        .priority-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .priority-low { background: #dbeafe; color: #1e40af; }
        .priority-medium { background: #fef3c7; color: #92400e; }
        .priority-high { background: #fee2e2; color: #991b1b; }
        .priority-urgent { background: #ede9fe; color: #5b21b6; }
        
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            margin-top: 24px;
        }
        
        .messages-section {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        .message-item {
            padding: 24px;
            border-left: 4px solid #4f46e5;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            gap: 16px;
        }
        
        .message-item:last-child {
            border-bottom: none;
        }
        
        .message-avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        
        .message-avatar.support {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
        }
        
        .message-avatar.customer {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        }
        
        .message-content {
            flex: 1;
            min-width: 0;
        }
        
        .message-header-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        
        .message-author {
            font-weight: 700;
            color: #1f2937;
            font-size: 14px;
        }
        
        .message-role {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            background: #f0f4ff;
            color: #4f46e5;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .message-role.anda {
            background: #4f46e5;
            color: white;
        }
        
        .message-time {
            color: #9ca3af;
            font-size: 12px;
        }
        
        .message-body {
            color: #374151;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .message-attachments {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .attachment-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 12px;
            color: #6b7280;
        }
        
        .attachment-icon {
            color: #9ca3af;
        }
        
        .attachment-item a {
            color: #4f46e5;
            text-decoration: none;
        }
        
        .attachment-item a:hover {
            text-decoration: underline;
        }
        
        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            height: fit-content;
        }
        
        .sidebar-title {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .sidebar-item {
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .sidebar-item:last-child {
            margin-bottom: 0;
        }
        
        .sidebar-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
        }
        
        .sidebar-value {
            color: #1f2937;
            font-weight: 600;
            font-size: 13px;
            text-align: right;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f4f6;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: #6b7280;
        }
        
        .empty-state-icon {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            
            .ticket-status-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <a href="/support-dashboard-customer" class="back-btn">
                <i class="fas fa-chevron-left"></i>
                <span>Kembali ke Daftar Tiket</span>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container" style="padding-top: 24px; padding-bottom: 48px;">
        <!-- Title Section -->
        <div class="page-title">
            <div>
                <div class="ticket-number" id="ticketNumber">-</div>
                <h1 class="ticket-subject" id="ticketSubject" style="min-height: 32px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px;">-</h1>
                <div class="ticket-status-row">
                    <span>
                        <span class="status-dot"></span>
                        <span class="status-text" id="ticketStatus">-</span>
                    </span>
                    <span class="priority-badge priority-medium" id="ticketPriority" style="background: #e5e7eb; color: #e5e7eb;">-</span>
                </div>
            </div>
        </div>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Messages -->
            <div class="messages-section" id="messagesContainer">
                <div style="padding: 24px; border-left: 4px solid #4f46e5; border-bottom: 1px solid #f3f4f6; display: flex; gap: 16px;">
                    <div style="width: 48px; height: 48px; border-radius: 8px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; flex-shrink: 0;"></div>
                    <div style="flex: 1;">
                        <div style="height: 14px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px; margin-bottom: 8px; width: 60%;"></div>
                        <div style="height: 60px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px;"></div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-title">Informasi Tiket</div>
                
                <div class="sidebar-item">
                    <span class="sidebar-label">Status</span>
                    <span class="sidebar-value" style="height: 14px; width: 60px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px;"></span>
                </div>
                
                <div class="sidebar-item">
                    <span class="sidebar-label">Prioritas</span>
                    <span class="sidebar-value" style="height: 14px; width: 60px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px;"></span>
                </div>
                
                <div class="sidebar-item">
                    <span class="sidebar-label">Department</span>
                    <span class="sidebar-value" style="height: 14px; width: 100px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px;"></span>
                </div>
                
                <div class="sidebar-item">
                    <span class="sidebar-label">Dibuat</span>
                    <span class="sidebar-value" style="height: 14px; width: 80px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px;"></span>
                </div>
                
                <div class="sidebar-item">
                    <span class="sidebar-label">Balasan Terakhir</span>
                    <span class="sidebar-value" style="height: 14px; width: 70px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px;"></span>
                </div>
                
                <div class="sidebar-item">
                    <span class="sidebar-label">Total Pesan</span>
                    <span class="sidebar-value" style="height: 14px; width: 40px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px;"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let ticketId = null;
        let ticketData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[Ticket-Detail] Page loaded');
            
            const params = new URLSearchParams(window.location.search);
            ticketId = params.get('id');
            
            if (!ticketId) {
                document.body.innerHTML = '<div style="padding: 20px; color: red;">Error: No ticket ID provided</div>';
                return;
            }

            await initAuth();
            
            if (!currentUser) {
                window.location.href = '/login';
                return;
            }

            await loadTicketDetail();
        });

        async function loadTicketDetail() {
            try {
                const token = localStorage.getItem('jwt_token');
                
                const response = await fetch(`/api/support/tickets/${ticketId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    throw new Error(`Failed to load ticket: ${response.status}`);
                }

                const data = await response.json();
                ticketData = data.ticket;

                // Get zona name - fetch all zonas and find by zona_id
                let zonaName = 'N/A';
                console.log('[Ticket-Detail] currentUser:', currentUser);
                console.log('[Ticket-Detail] zona_id:', currentUser.zona_id);
                
                if (currentUser.zona_id) {
                    try {
                        const zonaResponse = await fetch(`/api/zonas`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (zonaResponse.ok) {
                            const zonaData = await zonaResponse.json();
                            console.log('[Ticket-Detail] All zonas response:', zonaData);
                            
                            // Handle different response formats
                            let zonas = [];
                            if (Array.isArray(zonaData)) {
                                zonas = zonaData;
                            } else if (zonaData.data && Array.isArray(zonaData.data)) {
                                zonas = zonaData.data;
                            } else if (zonaData.zonas && Array.isArray(zonaData.zonas)) {
                                zonas = zonaData.zonas;
                            }
                            
                            console.log('[Ticket-Detail] Parsed zonas array:', zonas);
                            console.log('[Ticket-Detail] Looking for zona_id:', currentUser.zona_id, 'type:', typeof currentUser.zona_id);
                            
                            // Find by id (try both string and number comparison)
                            const userZona = zonas.find(z => {
                                console.log('[Ticket-Detail] Checking zona:', z.id, 'against', currentUser.zona_id, 'match:', z.id == currentUser.zona_id);
                                return z.id == currentUser.zona_id || String(z.id) === String(currentUser.zona_id);
                            });
                            
                            if (userZona) {
                                zonaName = userZona.nama || userZona.name || userZona.Nama || 'N/A';
                                console.log('[Ticket-Detail] Found zona:', zonaName, userZona);
                            } else {
                                console.warn('[Ticket-Detail] Zona not found for zona_id:', currentUser.zona_id);
                                console.log('[Ticket-Detail] Available zonas:', zonas.map(z => ({ id: z.id, nama: z.nama })));
                            }
                        }
                    } catch (e) {
                        console.warn('[Ticket-Detail] Could not fetch zonas:', e);
                    }
                }

                console.log('[Ticket-Detail] Final zonaName:', zonaName);
                renderTicketDetail(zonaName);
                renderMessages(zonaName);

            } catch (error) {
                console.error('[Ticket-Detail] Error:', error);
                document.getElementById('messagesContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div>${error.message}</div>
                    </div>
                `;
            }
        }

        function renderTicketDetail(zonaName) {
            const ticket = ticketData;
            const priorityClass = (ticket.priority || 'Medium').toLowerCase();

            console.log('[Ticket-Detail] Ticket data:', ticket);
            console.log('[Ticket-Detail] Created at:', ticket.created_at);

            document.getElementById('ticketNumber').textContent = ticket.ticket_number || 'N/A';
            document.getElementById('ticketSubject').textContent = ticket.subject || 'N/A';
            document.getElementById('ticketStatus').textContent = ticket.status || 'Open';
            
            const priorityBadge = document.getElementById('ticketPriority');
            if (priorityBadge) {
                priorityBadge.textContent = ticket.priority || 'Medium';
                priorityBadge.className = `priority-badge priority-${priorityClass}`;
            }

            const sidebarStatus = document.getElementById('sidebarStatus');
            const sidebarPriority = document.getElementById('sidebarPriority');
            const sidebarCategory = document.getElementById('sidebarCategory');
            const sidebarCreated = document.getElementById('sidebarCreated');
            const sidebarLastReply = document.getElementById('sidebarLastReply');
            const sidebarTotalMessages = document.getElementById('sidebarTotalMessages');

            if (sidebarStatus) sidebarStatus.textContent = ticket.status || '-';
            if (sidebarPriority) sidebarPriority.textContent = ticket.priority || '-';
            if (sidebarCategory) sidebarCategory.textContent = ticket.category || '-';
            
            const createdFormatted = formatDateTimeWIB(ticket.created_at);
            console.log('[Ticket-Detail] Created formatted:', createdFormatted);
            if (sidebarCreated) sidebarCreated.textContent = createdFormatted;
            
            if (sidebarLastReply) sidebarLastReply.textContent = getLastReplyTime(ticket);
            if (sidebarTotalMessages) sidebarTotalMessages.textContent = (ticketData.messages || []).length + 1;
        }

        function renderMessages(zonaName) {
            let html = '';
            
            if (ticketData.description) {
                // Clean zona name - remove leading zeros and extract number
                let cleanZonaName = zonaName;
                if (zonaName && zonaName !== 'N/A') {
                    // If it's "Zona 01", extract just "1"
                    const match = zonaName.match(/(\d+)/);
                    if (match) {
                        cleanZonaName = match[1].replace(/^0+/, '') || '0';
                    }
                }
                
                html += `
                    <div class="message-item">
                        <div class="message-avatar customer">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-header-row">
                                <span class="message-author">Zona ${cleanZonaName}</span>
                                <span class="message-role anda">ANDA</span>
                                <span class="message-time">${formatDateTimeWIB(ticketData.created_at)}</span>
                            </div>
                            <div class="message-body">${escapeHtml(ticketData.description)}</div>
                        </div>
                    </div>
                `;
            }
            
            const messages = ticketData.messages || [];
            
            if (messages.length === 0) {
                html += `
                    <div class="empty-state" style="padding: 40px 24px; border-top: 1px solid #f3f4f6;">
                        <div class="empty-state-icon">
                            <i class="fas fa-inbox"></i>
                        </div>
                        <div style="font-size: 13px;">Tidak ada balasan dari support team</div>
                    </div>
                `;
            } else {
                html += messages.map(msg => {
                    const isSupport = msg.user_id !== currentUser.userId;
                    const roleClass = !isSupport ? 'anda' : '';
                    
                    // Clean zona name for replies too
                    let cleanZonaName = zonaName;
                    if (zonaName && zonaName !== 'N/A') {
                        const match = zonaName.match(/(\d+)/);
                        if (match) {
                            cleanZonaName = match[1].replace(/^0+/, '') || '0';
                        }
                    }
                    
                    return `
                        <div class="message-item">
                            <div class="message-avatar ${isSupport ? 'support' : 'customer'}">
                                ${isSupport ? '<i class="fas fa-headset"></i>' : '<i class="fas fa-user"></i>'}
                            </div>
                            <div class="message-content">
                                <div class="message-header-row">
                                    <span class="message-author">${isSupport ? 'Tim Support' : 'Zona ' + cleanZonaName}</span>
                                    <span class="message-role ${roleClass}">${!isSupport ? 'ANDA' : 'Support'}</span>
                                    <span class="message-time">${formatDateTimeWIB(msg.created_at)}</span>
                                </div>
                                <div class="message-body">${escapeHtml(msg.message)}</div>
                                ${msg.attachments && msg.attachments.length > 0 ? `
                                    <div class="message-attachments">
                                        ${msg.attachments.map(att => `
                                            <div class="attachment-item">
                                                <span class="attachment-icon"><i class="fas fa-file"></i></span>
                                                <a href="/api/support/tickets/${ticketId}/download/${att.id}" target="_blank">
                                                    ${att.file_name}
                                                </a>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('messagesContainer').innerHTML = html;
        }

        function getLastReplyTime(ticket) {
            const messages = ticket.messages || [];
            if (messages.length === 0) return '-';
            
            const lastMessage = messages[messages.length - 1];
            return formatRelativeTime(lastMessage.created_at);
        }

        function formatDateTimeWIB(dateString) {
            if (!dateString) return '-';
            
            console.log('[DateFormat] Raw input:', dateString);
            
            try {
                // Parse as ISO string
                // Some timestamps may be UTC, some may be in WIB already
                // We need to detect and handle both cases
                
                let date = new Date(dateString);
                
                if (isNaN(date.getTime())) {
                    return '-';
                }
                
                console.log('[DateFormat] Parsed date:', date.toString());
                console.log('[DateFormat] toISOString:', date.toISOString());
                console.log('[DateFormat] getHours (local):', date.getHours());
                console.log('[DateFormat] getUTCHours:', date.getUTCHours());
                
                // Always use getUTCHours and add 7 for WIB
                // This handles both UTC timestamps and WIB timestamps correctly
                const utcHours = date.getUTCHours();
                const wibHours = (utcHours + 7) % 24;
                const dayOffset = utcHours + 7 >= 24 ? 1 : 0;
                
                // Create a date in UTC+7
                const wibDate = new Date(date.getTime() + (7 * 60 * 60 * 1000));
                
                console.log('[DateFormat] UTC hours:', utcHours, '-> WIB hours:', wibHours);
                console.log('[DateFormat] Using UTC methods on adjusted date');
                
                const year = wibDate.getUTCFullYear();
                const month = String(wibDate.getUTCMonth() + 1).padStart(2, '0');
                const day = String(wibDate.getUTCDate()).padStart(2, '0');
                const hours = String(wibDate.getUTCHours()).padStart(2, '0');
                const minutes = String(wibDate.getUTCMinutes()).padStart(2, '0');
                const seconds = String(wibDate.getUTCSeconds()).padStart(2, '0');
                
                const formatted = `${day}/${month}/${year}, ${hours}:${minutes}:${seconds}`;
                console.log('[DateFormat] Final WIB formatted:', formatted);
                
                return formatted;
            } catch (e) {
                console.error('[DateFormat] Error:', e);
                return '-';
            }
        }

        function formatRelativeTime(dateString) {
            if (!dateString) return '-';
            
            const date = new Date(dateString);
            const now = new Date();
            
            const diffMs = now - date;
            const diffHours = diffMs / (1000 * 60 * 60);
            const diffDays = diffMs / (1000 * 60 * 60 * 24);

            if (diffHours < 1) {
                return 'Baru saja';
            } else if (diffHours < 24) {
                return `${Math.floor(diffHours)}h lalu`;
            } else if (diffDays < 7) {
                return `${Math.floor(diffDays)}d lalu`;
            } else {
                return '-';
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
