<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Admin Zona | Pusat Arsip Anka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css?t=1735689600">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            zoom: 0.8;
        }

        /* Hide sidebar initially to prevent flash */
        #sidebar {
            display: none !important;
        }

        /* Main content stretches full width initially, then adjusts when sidebar shows */
        #main-content {
            margin-left: 0;
            transition: margin-left 0.3s ease-in-out;
        }

        #main-content.with-sidebar {
            margin-left: 16rem; /* ml-64 = 16rem */
        }

        .invoice-table {
            font-family: 'Poppins', sans-serif;
        }

        .invoice-container {
            padding: 10px;
            width: 100%;
            margin: 0;
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .invoice-header h1 {
            font-size: 28px;
            color: #2c3e50;
            font-weight: 900;
            text-align: left;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-refresh {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-refresh:hover {
            background: #2980b9;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid #f0f0f0;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 13px;
            color: #7f8c8d;
            text-transform: uppercase;
            font-weight: 900;
        }

        .stat-card.total .stat-value { color: #3498db; }
        .stat-card.belum-lunas .stat-value { color: #f39c12; }
        .stat-card.lunas .stat-value { color: #27ae60; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #34495e;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 13px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-top: 1px solid #ecf0f1;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 13px;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        @media (max-width: 768px) {
            html, body {
                zoom: 0.6;
            }
            .filter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 z-40"></aside>

    <!-- Main Content -->
    <main id="main-content" class="min-h-screen transition-all duration-300">
        <!-- Top Bar -->
        <header class="bg-white border-b border-gray-200 p-4 shadow-sm">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-bars text-gray-600"></i>
                    </button>
                    <h1 class="text-2xl font-bold text-gray-900">Dashboard Admin Zona</h1>
                </div>
                <div id="user-info" class="flex items-center gap-4">
                    <div class="text-right">
                        <p id="user-name" class="font-semibold text-gray-900">Loading...</p>
                        <p id="user-zona" class="text-sm text-gray-500">Zona: -</p>
                    </div>
                    <button onclick="logout()" class="btn" style="background: #e74c3c; padding: 8px 12px; font-size: 12px;">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="invoice-container">
            <!-- Header -->
            <div class="invoice-header">
                <div>
                    <h2 class="text-xl font-bold text-gray-900">Invoice Zona Anda</h2>
                    <p class="text-sm text-gray-500">Kelola invoice berdasarkan supplier, keterangan, tahun, dan bulan</p>
                </div>
                <div class="header-actions">
                    <button class="btn-refresh" onclick="location.reload()">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-section">
                <div class="filter-grid">
                    <!-- Search Faktur/Konsumen -->
                    <div class="filter-group">
                        <label for="filterSearch">Cari Faktur/Konsumen</label>
                        <input type="text" id="filterSearch" placeholder="Cari faktur atau konsumen...">
                    </div>

                    <!-- Supplier -->
                    <div class="filter-group">
                        <label for="filterSupplier">Supplier</label>
                        <select id="filterSupplier">
                            <option value="">Semua Supplier</option>
                        </select>
                    </div>

                    <!-- Keterangan -->
                    <div class="filter-group">
                        <label for="filterKeterangan">Keterangan</label>
                        <select id="filterKeterangan">
                            <option value="">Semua</option>
                            <option value="PPN">PPN</option>
                            <option value="NON PPN">NON PPN</option>
                            <option value="GUNGGUNG">GUNGGUNG</option>
                        </select>
                    </div>

                    <!-- Tahun -->
                    <div class="filter-group">
                        <label for="filterYear">Tahun</label>
                        <select id="filterYear">
                            <option value="">Semua Tahun</option>
                        </select>
                    </div>

                    <!-- Bulan -->
                    <div class="filter-group">
                        <label for="filterMonth">Bulan</label>
                        <select id="filterMonth">
                            <option value="">Semua Bulan</option>
                            <option value="01">Januari</option>
                            <option value="02">Februari</option>
                            <option value="03">Maret</option>
                            <option value="04">April</option>
                            <option value="05">Mei</option>
                            <option value="06">Juni</option>
                            <option value="07">Juli</option>
                            <option value="08">Agustus</option>
                            <option value="09">September</option>
                            <option value="10">Oktober</option>
                            <option value="11">November</option>
                            <option value="12">Desember</option>
                        </select>
                    </div>
                </div>

                <!-- Filter Buttons -->
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn" onclick="applyFilters()">
                        <i class="fas fa-filter"></i> Terapkan Filter
                    </button>
                    <button class="btn" style="background: #95a5a6;" onclick="resetFilters()">
                        <i class="fas fa-redo"></i> Reset
                    </button>
                </div>
            </div>

            <!-- Invoice Table -->
            <div style="background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: #34495e;">
                            <th style="padding: 15px 12px; text-align: left; font-weight: 600; font-size: 14px; text-transform: uppercase; color: white; width: 10%; vertical-align: middle;">TANGGAL</th>
                            <th style="padding: 15px 12px; text-align: left; font-weight: 600; font-size: 14px; text-transform: uppercase; color: white; width: 12%; vertical-align: middle;">NO FAKTUR</th>
                            <th style="padding: 15px 12px; text-align: left; font-weight: 600; font-size: 14px; text-transform: uppercase; color: white; width: 11%; vertical-align: middle;">STATUS BAYAR</th>
                            <th style="padding: 15px 12px; text-align: left; font-weight: 600; font-size: 14px; text-transform: uppercase; color: white; width: 15%; vertical-align: middle;">TOKO</th>
                            <th style="padding: 15px 12px; text-align: left; font-weight: 600; font-size: 14px; text-transform: uppercase; color: white; width: 15%; vertical-align: middle;">SUPPLIER</th>
                            <th style="padding: 15px 12px; text-align: left; font-weight: 600; font-size: 14px; text-transform: uppercase; color: white; width: 12%; vertical-align: middle;">TOTAL</th>
                            <th style="padding: 15px 12px; text-align: left; font-weight: 600; font-size: 14px; text-transform: uppercase; color: white; width: 15%; vertical-align: middle;">KETERANGAN</th>
                            <th style="padding: 15px 12px; text-align: center; font-weight: 600; font-size: 14px; text-transform: uppercase; color: white; width: 8%; vertical-align: middle;">AKSI</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceTableBody">
                        <tr>
                            <td colspan="8" class="empty-state">
                                <i class="fas fa-spinner fa-spin"></i> Memuat data...
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Pagination -->
                <div class="pagination">
                    <div style="color: #7f8c8d; font-size: 13px;">
                        <span id="paginationInfo">Menampilkan 0 - 0 dari 0 invoice</span>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn" id="prevPageBtn" onclick="previousPage()" disabled>
                            <i class="fas fa-chevron-left"></i> Sebelumnya
                        </button>
                        <button class="btn" id="nextPageBtn" onclick="nextPage()">
                            Selanjutnya <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js?t=1735689600"></script>
    <script src="js/supabase.js?t=1735689600"></script>
    <script src="js/auth.js?t=1735689600"></script>
    <script src="js/utils.js?t=1735862400"></script>
    <script src="js/sidebar.js?t=1735862400"></script>

    <script>
        let currentPage = 1;
        let currentFilters = {};
        let totalCount = 0;
        let pageSize = 20;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await initAuth();
                
                // Wait for window.currentUser to be set by initAuth
                let retries = 0;
                while (!window.currentUser && retries < 50) {
                    await new Promise(resolve => setTimeout(resolve, 50));
                    retries++;
                }
                
                const currentUser = window.currentUser;
                
                if (!currentUser) {
                    console.error('[AdminZona] currentUser still not available after retries');
                    document.getElementById('user-name').textContent = 'Unknown';
                    document.getElementById('user-zona').textContent = 'Zona: -';
                    // Still show the page even without user
                    document.getElementById('sidebar').style.display = 'block';
                    document.getElementById('main-content').classList.add('with-sidebar');
                    return;
                }
                
                // Display user info
                const userEmail = currentUser.email || currentUser.username || currentUser.name || 'Admin Zona';
                const zonaName = currentUser.zonas?.nama || currentUser.zonas?.kode || currentUser.zona_kode || 'Unknown';
                
                console.log('[AdminZona] User:', userEmail, 'Zona:', zonaName, 'Full user:', currentUser);
                
                document.getElementById('user-name').textContent = userEmail;
                document.getElementById('user-zona').textContent = `Zona: ${zonaName}`;

                // Show sidebar and main content now that initialization is complete
                document.getElementById('sidebar').style.display = 'block';
                document.getElementById('main-content').classList.add('with-sidebar');

                // Load all data first to populate filters
                console.log('[AdminZona] Starting loadAllInvoices...');
                try {
                    await loadAllInvoices();
                    console.log('[AdminZona] loadAllInvoices completed');
                } catch (err) {
                    console.error('[AdminZona] Error loading all invoices:', err);
                }
                
                // Load filtered data
                console.log('[AdminZona] Starting loadInvoices...');
                try {
                    await loadInvoices();
                    console.log('[AdminZona] loadInvoices completed');
                } catch (err) {
                    console.error('[AdminZona] Error loading invoices:', err);
                }
            } catch (err) {
                console.error('[AdminZona] Init error:', err);
                // Still show the page even if there's an error
                document.getElementById('sidebar').style.display = 'block';
                document.getElementById('main-content').classList.add('with-sidebar');
            }
        });

        // Load ALL invoices to get unique years and months
        async function loadAllInvoices() {
            try {
                const res = await API.get('/api/invoice/list?limit=10000&offset=0');
                const invoices = res.data || [];
                
                // Extract unique years and months from data
                const yearsSet = new Set();
                const monthsSet = new Set();
                
                invoices.forEach(inv => {
                    if (inv.tanggal) {
                        const date = new Date(inv.tanggal);
                        yearsSet.add(date.getFullYear().toString());
                        monthsSet.add(String(date.getMonth() + 1).padStart(2, '0'));
                    }
                });

                // Populate year dropdown with actual years from data
                const yearSelect = document.getElementById('filterYear');
                const years = Array.from(yearsSet).sort((a, b) => b - a); // Newest first
                
                // Clear and rebuild year dropdown
                yearSelect.innerHTML = '<option value="">Semua Tahun</option>';
                years.forEach(year => {
                    const opt = document.createElement('option');
                    opt.value = year;
                    opt.textContent = year;
                    yearSelect.appendChild(opt);
                });
                
                console.log('[AdminZona] Year filter populated with:', years.length, 'years:', years);

                // ONLY populate month dropdown with months that have data
                const monthSelect = document.getElementById('filterMonth');
                const monthNames = {
                    '01': 'Januari', '02': 'Februari', '03': 'Maret', '04': 'April',
                    '05': 'Mei', '06': 'Juni', '07': 'Juli', '08': 'Agustus',
                    '09': 'September', '10': 'Oktober', '11': 'November', '12': 'Desember'
                };
                
                // Clear ALL existing options
                monthSelect.innerHTML = '<option value="">Semua Bulan</option>';
                
                // Only add months that have data
                const months = Array.from(monthsSet).sort();
                months.forEach(month => {
                    const opt = document.createElement('option');
                    opt.value = month;
                    opt.textContent = monthNames[month];
                    monthSelect.appendChild(opt);
                });
                
                console.log('[AdminZona] Month filter populated with:', months.length, 'months:', months);

                // Get unique suppliers and populate dropdown
                const suppliers = [...new Set(invoices.map(inv => inv.toko).filter(Boolean))].sort();
                const supplierSelect = document.getElementById('filterSupplier');
                
                // Clear and rebuild supplier dropdown
                supplierSelect.innerHTML = '<option value="">Semua Supplier</option>';
                suppliers.forEach(supplier => {
                    const opt = document.createElement('option');
                    opt.value = supplier;
                    opt.textContent = supplier;
                    supplierSelect.appendChild(opt);
                });
                
                console.log('[AdminZona] Loaded', invoices.length, 'invoices - Years:', years.length, 'Months:', months.length, 'Suppliers:', suppliers.length);
            } catch (err) {
                console.error('[AdminZona] Error loading all invoices:', err);
            }
        }

        async function loadInvoices() {
            try {
                const params = new URLSearchParams({
                    limit: pageSize,
                    offset: (currentPage - 1) * pageSize
                });

                // Add filters
                const supplier = document.getElementById('filterSupplier')?.value;
                const keterangan = document.getElementById('filterKeterangan')?.value;
                const year = document.getElementById('filterYear')?.value;
                const month = document.getElementById('filterMonth')?.value;
                const search = document.getElementById('filterSearch')?.value;

                if (supplier) params.append('toko', supplier);
                if (keterangan) params.append('keterangan', keterangan);
                if (search) params.append('search', search); // Add search parameter

                const url = `/api/invoice/list?${params.toString()}`;
                console.log('[AdminZona] Loading from:', url);

                const res = await API.get(url);
                let invoices = res.data || [];
                totalCount = res.count || 0;

                // Client-side filtering by year/month
                if (year || month) {
                    invoices = invoices.filter(inv => {
                        if (!inv.tanggal) return false;
                        const date = new Date(inv.tanggal);
                        const invYear = date.getFullYear().toString();
                        const invMonth = String(date.getMonth() + 1).padStart(2, '0');

                        if (year && invYear !== year) return false;
                        if (month && invMonth !== month) return false;
                        return true;
                    });
                }

                renderInvoices(invoices);
                updatePagination();

                console.log('[AdminZona] Loaded', invoices.length, 'invoices');
            } catch (err) {
                console.error('[AdminZona] Error loading invoices:', err);
                document.getElementById('invoiceTableBody').innerHTML = `
                    <tr><td colspan="8" class="empty-state text-red-500">Error: ${err.message}</td></tr>
                `;
            }
        }

        // ============================================
        // CUSTOM CONFIRMATION MODAL
        // ============================================
        let confirmationCallback = null;

        function showConfirmation(title, message, callback) {
            confirmationCallback = callback;
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmBtn').textContent = 'Lanjutkan';
            const modal = document.getElementById('confirmationModal');
            modal.style.display = 'flex';
        }

        function closeConfirmation() {
            confirmationCallback = null;
            document.getElementById('confirmationModal').style.display = 'none';
        }

        function executeConfirmation() {
            if (confirmationCallback) {
                confirmationCallback();
            }
            closeConfirmation();
        }

        function logout() {
            // Show custom confirmation modal with icon
            const modal = document.getElementById('confirmationModal');
            const titleElement = document.getElementById('confirmTitle');
            
            // Remove any existing icon
            const existingIcon = titleElement.parentElement.querySelector('.logout-icon');
            if (existingIcon) {
                existingIcon.remove();
            }
            
            // Create and add warning icon styling
            const iconDiv = document.createElement('div');
            iconDiv.className = 'logout-icon';
            iconDiv.style.cssText = 'font-size: 64px; color: #f39c12; margin-bottom: 20px; text-align: center;';
            iconDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
            titleElement.parentElement.insertBefore(iconDiv, titleElement);
            
            confirmationCallback = () => {
                // Clear everything and redirect
                localStorage.removeItem('jwt_token');
                localStorage.removeItem('currentUser');
                localStorage.removeItem('sessionToken');
                localStorage.removeItem('user_data');
                localStorage.removeItem('device_session_id');
                
                console.log('[AdminZona] User logged out');
                window.location.href = 'index.html';
            };
            
            titleElement.textContent = 'Logout Akun?';
            document.getElementById('confirmMessage').textContent = 'Apakah Anda yakin ingin keluar dari sistem?';
            document.getElementById('confirmBtn').textContent = 'YA, LOGOUT';
            
            modal.style.display = 'flex';
        }

        function renderInvoices(invoices) {
            const tbody = document.getElementById('invoiceTableBody');

            if (invoices.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Tidak ada invoice yang ditemukan</td></tr>';
                return;
            }

            tbody.innerHTML = invoices.map(inv => `
                <tr style="border-bottom: 2px solid #34495e;">
                    <td style="padding: 15px 12px; font-size: 14px; color: #2c3e50; vertical-align: middle;">${new Date(inv.tanggal).toLocaleDateString('id-ID')}</td>
                    <td style="padding: 15px 12px; font-size: 14px; color: #2c3e50; vertical-align: middle;"><strong>${inv.faktur}</strong></td>
                    <td style="padding: 15px 12px; font-size: 14px; color: #2c3e50; vertical-align: middle;">
                        <span class="px-2 py-1 text-xs font-semibold rounded-full 
                            ${inv.status === 'Lunas' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                            ${inv.status || 'PENDING'}
                        </span>
                    </td>
                    <td style="padding: 15px 12px; font-size: 14px; color: #2c3e50; vertical-align: middle;">${inv.konsumen || '-'}</td>
                    <td style="padding: 15px 12px; font-size: 14px; color: #2c3e50; vertical-align: middle;">${inv.toko || '-'}</td>
                    <td style="padding: 15px 12px; font-size: 14px; color: #2c3e50; vertical-align: middle;">Rp ${(inv.total_jumlah_jual || 0).toLocaleString('id-ID')}</td>
                    <td style="padding: 15px 12px; font-size: 14px; color: #2c3e50; vertical-align: middle;">${inv.keterangan || '-'}</td>
                    <td style="padding: 15px 12px; font-size: 14px; color: #2c3e50; vertical-align: middle; text-align: center;">
                        <button onclick="viewDetail('${inv.id}')" class="text-blue-600 hover:text-blue-900 text-sm" title="Lihat">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function updatePagination() {
            const totalPages = Math.ceil(totalCount / pageSize);
            const startRow = (currentPage - 1) * pageSize + 1;
            const endRow = Math.min(currentPage * pageSize, totalCount);

            document.getElementById('paginationInfo').textContent = 
                `Menampilkan ${startRow} - ${endRow} dari ${totalCount} invoice`;

            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
        }

        async function applyFilters() {
            currentPage = 1;
            await loadInvoices();
        }

        function resetFilters() {
            document.getElementById('filterSearch').value = '';
            document.getElementById('filterSupplier').value = '';
            document.getElementById('filterKeterangan').value = '';
            document.getElementById('filterYear').value = '';
            document.getElementById('filterMonth').value = '';
            currentPage = 1;
            loadInvoices();
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                loadInvoices();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(totalCount / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                loadInvoices();
            }
        }

        function viewDetail(id) {
            alert('Detail invoice: ' + id);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            mainContent.classList.toggle('with-sidebar');
        }
    </script>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 12px; padding: 40px; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); text-align: center;">
            <h3 id="confirmTitle" style="margin: 0 0 15px 0; font-size: 24px; color: #2c3e50; font-weight: 600;">Konfirmasi</h3>
            <p id="confirmMessage" style="margin: 0 0 30px 0; font-size: 16px; color: #7f8c8d; line-height: 1.5;">Apakah Anda yakin?</p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button onclick="closeConfirmation()" style="flex: 1; padding: 12px 24px; background: #95a5a6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 15px; transition: background 0.2s;">
                    Batal
                </button>
                <button id="confirmBtn" onclick="executeConfirmation()" style="flex: 1; padding: 12px 24px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 15px; transition: background 0.2s;">
                    Lanjutkan
                </button>
            </div>
        </div>
    </div>

</body>
</html>
