<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Admin Zona | Pusat Arsip Anka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css?t=1735689600">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            zoom: 0.75;
        }

        .invoice-table {
            font-family: 'Poppins', sans-serif;
        }

        .invoice-container {
            padding: 10px;
            width: 100%;
            margin: 0;
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .invoice-header h1 {
            font-size: 28px;
            color: #2c3e50;
            font-weight: 900;
            text-align: left;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-refresh {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-refresh:hover {
            background: #2980b9;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid #f0f0f0;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 13px;
            color: #7f8c8d;
            text-transform: uppercase;
            font-weight: 900;
        }

        .stat-card.total .stat-value { color: #3498db; }
        .stat-card.belum-lunas .stat-value { color: #f39c12; }
        .stat-card.lunas .stat-value { color: #27ae60; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #34495e;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 13px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-top: 1px solid #ecf0f1;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 13px;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        @media (max-width: 768px) {
            html, body {
                zoom: 0.6;
            }
            .filter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 z-40"></aside>

    <!-- Main Content -->
    <main id="main-content" class="ml-64 min-h-screen transition-all duration-300">
        <!-- Top Bar -->
        <header class="bg-white border-b border-gray-200 p-4 shadow-sm">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-bars text-gray-600"></i>
                    </button>
                    <h1 class="text-2xl font-bold text-gray-900">Dashboard Admin Zona</h1>
                </div>
                <div id="user-info" class="text-right">
                    <p id="user-name" class="font-semibold text-gray-900"></p>
                    <p id="user-zona" class="text-sm text-gray-500"></p>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="invoice-container">
            <!-- Header -->
            <div class="invoice-header">
                <div>
                    <h2 class="text-xl font-bold text-gray-900">Invoice Zona Anda</h2>
                    <p class="text-sm text-gray-500">Kelola invoice berdasarkan supplier, keterangan, tahun, dan bulan</p>
                </div>
                <div class="header-actions">
                    <button class="btn-refresh" onclick="location.reload()">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-container">
                <div class="stat-card total">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Total Invoice</div>
                </div>
                <div class="stat-card belum-lunas">
                    <div class="stat-value" id="statBelumLunas">0</div>
                    <div class="stat-label">Belum Lunas</div>
                </div>
                <div class="stat-card lunas">
                    <div class="stat-value" id="statLunas">0</div>
                    <div class="stat-label">Lunas</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-section">
                <div class="filter-grid">
                    <!-- Search Faktur/Konsumen -->
                    <div class="filter-group">
                        <label for="filterSearch">Cari Faktur/Konsumen</label>
                        <input type="text" id="filterSearch" placeholder="Cari faktur atau konsumen...">
                    </div>

                    <!-- Supplier -->
                    <div class="filter-group">
                        <label for="filterSupplier">Supplier (Konsumen)</label>
                        <select id="filterSupplier">
                            <option value="">Semua Supplier</option>
                        </select>
                    </div>

                    <!-- Keterangan -->
                    <div class="filter-group">
                        <label for="filterKeterangan">Keterangan</label>
                        <select id="filterKeterangan">
                            <option value="">Semua</option>
                            <option value="PPN">PPN</option>
                            <option value="NON PPN">NON PPN</option>
                            <option value="GUNGGUNG">GUNGGUNG</option>
                        </select>
                    </div>

                    <!-- Tahun -->
                    <div class="filter-group">
                        <label for="filterYear">Tahun</label>
                        <select id="filterYear">
                            <option value="">Semua Tahun</option>
                        </select>
                    </div>

                    <!-- Bulan -->
                    <div class="filter-group">
                        <label for="filterMonth">Bulan</label>
                        <select id="filterMonth">
                            <option value="">Semua Bulan</option>
                            <option value="01">Januari</option>
                            <option value="02">Februari</option>
                            <option value="03">Maret</option>
                            <option value="04">April</option>
                            <option value="05">Mei</option>
                            <option value="06">Juni</option>
                            <option value="07">Juli</option>
                            <option value="08">Agustus</option>
                            <option value="09">September</option>
                            <option value="10">Oktober</option>
                            <option value="11">November</option>
                            <option value="12">Desember</option>
                        </select>
                    </div>
                </div>

                <!-- Filter Buttons -->
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn" onclick="applyFilters()">
                        <i class="fas fa-filter"></i> Terapkan Filter
                    </button>
                    <button class="btn" style="background: #95a5a6;" onclick="resetFilters()">
                        <i class="fas fa-redo"></i> Reset
                    </button>
                </div>
            </div>

            <!-- Invoice Table -->
            <div style="background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <table>
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>No Faktur</th>
                            <th>Supplier</th>
                            <th>Status Bayar</th>
                            <th>Keterangan</th>
                            <th>Total</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceTableBody">
                        <tr>
                            <td colspan="7" class="empty-state">
                                <i class="fas fa-spinner fa-spin"></i> Memuat data...
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Pagination -->
                <div class="pagination">
                    <div style="color: #7f8c8d; font-size: 13px;">
                        <span id="paginationInfo">Menampilkan 0 - 0 dari 0 invoice</span>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn" id="prevPageBtn" onclick="previousPage()" disabled>
                            <i class="fas fa-chevron-left"></i> Sebelumnya
                        </button>
                        <button class="btn" id="nextPageBtn" onclick="nextPage()">
                            Selanjutnya <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js?t=1735689600"></script>
    <script src="js/supabase.js?t=1735689600"></script>
    <script src="js/auth.js?t=1735689600"></script>
    <script src="js/utils.js?t=1735862400"></script>
    <script src="js/sidebar.js?t=1735862400"></script>

    <script>
        let currentPage = 1;
        let currentFilters = {};
        let totalCount = 0;
        let pageSize = 20;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            
            const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
            document.getElementById('user-name').textContent = user.email || 'User';
            document.getElementById('user-zona').textContent = `Zona: ${user.zona_kode || user.zona_id}`;

            // Load all data first to populate filters
            await loadAllInvoices();
            
            // Load filtered data
            await loadInvoices();
        });

        // Load ALL invoices to get unique years and months
        async function loadAllInvoices() {
            try {
                const res = await API.get('/api/invoice/list?limit=10000&offset=0');
                const invoices = res.data || [];
                
                // Extract unique years and months from data
                const yearsSet = new Set();
                const monthsSet = new Set();
                
                invoices.forEach(inv => {
                    if (inv.tanggal) {
                        const date = new Date(inv.tanggal);
                        yearsSet.add(date.getFullYear().toString());
                        monthsSet.add(String(date.getMonth() + 1).padStart(2, '0'));
                    }
                });

                // Populate year dropdown with actual years from data
                const yearSelect = document.getElementById('filterYear');
                const years = Array.from(yearsSet).sort((a, b) => b - a); // Newest first
                years.forEach(year => {
                    const opt = document.createElement('option');
                    opt.value = year;
                    opt.textContent = year;
                    yearSelect.appendChild(opt);
                });

                // Populate month dropdown (only months that have data)
                const monthSelect = document.getElementById('filterMonth');
                const monthNames = {
                    '01': 'Januari', '02': 'Februari', '03': 'Maret', '04': 'April',
                    '05': 'Mei', '06': 'Juni', '07': 'Juli', '08': 'Agustus',
                    '09': 'September', '10': 'Oktober', '11': 'November', '12': 'Desember'
                };
                
                const months = Array.from(monthsSet).sort();
                months.forEach(month => {
                    const opt = document.createElement('option');
                    opt.value = month;
                    opt.textContent = monthNames[month];
                    monthSelect.appendChild(opt);
                });

                // Get unique suppliers and populate dropdown
                const suppliers = [...new Set(invoices.map(inv => inv.konsumen).filter(Boolean))].sort();
                const supplierSelect = document.getElementById('filterSupplier');
                suppliers.forEach(supplier => {
                    const opt = document.createElement('option');
                    opt.value = supplier;
                    opt.textContent = supplier;
                    supplierSelect.appendChild(opt);
                });

                console.log('[AdminZona] Loaded', invoices.length, 'invoices - Years:', years.length, 'Months:', months.length, 'Suppliers:', suppliers.length);
            } catch (err) {
                console.error('[AdminZona] Error loading all invoices:', err);
            }
        }

        async function loadInvoices() {
            try {
                const params = new URLSearchParams({
                    limit: pageSize,
                    offset: (currentPage - 1) * pageSize
                });

                // Add filters
                const supplier = document.getElementById('filterSupplier')?.value;
                const keterangan = document.getElementById('filterKeterangan')?.value;
                const year = document.getElementById('filterYear')?.value;
                const month = document.getElementById('filterMonth')?.value;
                const search = document.getElementById('filterSearch')?.value;

                if (supplier) params.append('konsumen', supplier);
                if (keterangan) params.append('keterangan', keterangan);
                if (search) params.append('search', search); // Add search parameter

                const url = `/api/invoice/list?${params.toString()}`;
                console.log('[AdminZona] Loading from:', url);

                const res = await API.get(url);
                let invoices = res.data || [];
                totalCount = res.count || 0;

                // Client-side filtering by year/month
                if (year || month) {
                    invoices = invoices.filter(inv => {
                        if (!inv.tanggal) return false;
                        const date = new Date(inv.tanggal);
                        const invYear = date.getFullYear().toString();
                        const invMonth = String(date.getMonth() + 1).padStart(2, '0');

                        if (year && invYear !== year) return false;
                        if (month && invMonth !== month) return false;
                        return true;
                    });
                }

                renderInvoices(invoices);
                updateStats(invoices);
                updatePagination();

                console.log('[AdminZona] Loaded', invoices.length, 'invoices');
            } catch (err) {
                console.error('[AdminZona] Error loading invoices:', err);
                document.getElementById('invoiceTableBody').innerHTML = `
                    <tr><td colspan="7" class="empty-state text-red-500">Error: ${err.message}</td></tr>
                `;
            }
        }

        function renderInvoices(invoices) {
            const tbody = document.getElementById('invoiceTableBody');

            if (invoices.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Tidak ada invoice yang ditemukan</td></tr>';
                return;
            }

            tbody.innerHTML = invoices.map(inv => `
                <tr>
                    <td>${new Date(inv.tanggal).toLocaleDateString('id-ID')}</td>
                    <td><strong>${inv.faktur}</strong></td>
                    <td>${inv.konsumen || '-'}</td>
                    <td>
                        <span class="px-2 py-1 text-xs font-semibold rounded-full 
                            ${inv.status === 'Lunas' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                            ${inv.status || 'PENDING'}
                        </span>
                    </td>
                    <td>${inv.keterangan || '-'}</td>
                    <td>Rp ${(inv.total_jumlah_jual || 0).toLocaleString('id-ID')}</td>
                    <td>
                        <button onclick="viewDetail('${inv.id}')" class="text-blue-600 hover:text-blue-900 text-sm">
                            <i class="fas fa-eye"></i> Lihat
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(invoices) {
            const total = invoices.length;
            const belumLunas = invoices.filter(i => i.status !== 'Lunas').length;
            const lunas = invoices.filter(i => i.status === 'Lunas').length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statBelumLunas').textContent = belumLunas;
            document.getElementById('statLunas').textContent = lunas;
        }

        function updatePagination() {
            const totalPages = Math.ceil(totalCount / pageSize);
            const startRow = (currentPage - 1) * pageSize + 1;
            const endRow = Math.min(currentPage * pageSize, totalCount);

            document.getElementById('paginationInfo').textContent = 
                `Menampilkan ${startRow} - ${endRow} dari ${totalCount} invoice`;

            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
        }

        async function applyFilters() {
            currentPage = 1;
            await loadInvoices();
        }

        function resetFilters() {
            document.getElementById('filterSearch').value = '';
            document.getElementById('filterSupplier').value = '';
            document.getElementById('filterKeterangan').value = '';
            document.getElementById('filterYear').value = '';
            document.getElementById('filterMonth').value = '';
            currentPage = 1;
            loadInvoices();
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                loadInvoices();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(totalCount / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                loadInvoices();
            }
        }

        function viewDetail(id) {
            alert('Detail invoice: ' + id);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            mainContent.classList.toggle('ml-64');
            mainContent.classList.toggle('ml-0');
        }
    </script>
</body>
</html>
